<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik üben – Schwingungen (Faden- &amp; Federpendel)</title>
<style>
:root{color-scheme:dark light;--bg:#0b1220;--bg2:#111a2e;--panel:#16223a;--panel2:#1c2b48;--line:#2b3c5e;--fg:#e8eefc;--mut:#8da2c8;--pri:#4cc2ff;--pri2:#2b7fff;--ok:#2ecc71;--bad:#ff5d6c;--warn:#f5b942;--acc:#b49cff;--shadow:0 8px 26px rgba(0,0,0,.35);--r:14px;--kred:#ff6b6b;--kblue:#4cc2ff;--kgreen:#2ecc71;--kpurple:#b49cff;--kgray:#8da2c8}
@media (prefers-color-scheme:light){:root{--bg:#edf1f8;--bg2:#e2e9f4;--panel:#ffffff;--panel2:#f1f5fb;--line:#cdd7e8;--fg:#14213d;--mut:#5a6a8a;--pri:#0b7fd1;--pri2:#1d4ed8;--ok:#14803d;--bad:#c81e3a;--warn:#a96a00;--acc:#6d4ad8;--shadow:0 8px 26px rgba(30,50,90,.13);--kred:#d62839;--kblue:#0b7fd1;--kgreen:#15803d;--kpurple:#6d4ad8;--kgray:#5a6a8a}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 410px;grid-template-areas:"top top top" "nav main side";gap:16px;padding:14px;max-width:1900px;margin:0 auto}
.top{grid-area:top;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;box-shadow:var(--shadow)}
.top h1{font-size:1.15rem;margin:0;flex:1;min-width:220px}
.top h1 small{display:block;font-weight:400;color:var(--mut);font-size:.8rem}
.gbar{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.85rem}
.gbar .bar{width:150px;height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.gbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--ok));width:0}
#nav{grid-area:nav;position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
#nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:.92rem;line-height:1.25;cursor:pointer}
#nav a:hover{background:var(--panel2)}
#nav a.on{background:var(--pri2);color:#fff}
#nav a .ic{flex:none;width:1.4em;text-align:center}
#nav a .tx{flex:1}
#nav a .st{font-size:.72rem;opacity:.8;white-space:nowrap}
#nav .sep{height:1px;background:var(--line);margin:6px 4px}
#main{grid-area:main;min-width:0}
#side{grid-area:side;position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:1.25rem}
.card h3{margin:14px 0 6px;font-size:1.02rem;color:var(--pri)}
h1.lt{font-size:1.6rem;margin:2px 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.mut{color:var(--mut)}
details.theory{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:16px;box-shadow:var(--shadow)}
details.theory>summary{cursor:pointer;padding:12px 18px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.theory>summary::before{content:"▸";transition:.2s}
details.theory[open]>summary::before{transform:rotate(90deg)}
details.theory .tb{padding:0 20px 16px}
.tb{overflow-x:auto}
.tb table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
.tb th,.tb td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.tb th{background:var(--panel2)}
.tb ul{margin:6px 0 6px 20px;padding:0}
.box{background:var(--panel2);border-left:4px solid var(--pri);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.box.warn{border-color:var(--warn)}
.box.ok{border-color:var(--ok)}
.fbox{display:flex;flex-wrap:wrap;gap:8px 22px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:8px 0;font-size:1.1rem;align-items:center}
/* ---------- Math ---------- */
.m{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif;font-size:1.1em;white-space:nowrap;line-height:1}
.m .v{font-style:italic}
.m .op{margin:0 .22em}
.m .u{font-style:normal}
.m .thin{display:inline-block;width:.25em}
.m sub{font-size:.68em;vertical-align:-.28em;line-height:0}
.m sup{font-size:.68em;vertical-align:.6em;line-height:0}
.m .fnm{margin-right:.08em}
.m .par{opacity:.85}
.m .ph{color:var(--mut);opacity:.7}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.15}
.frac>.fn{border-bottom:1.5px solid currentColor;padding:0 .25em .08em}
.frac>.fd{padding:.1em .25em 0}
.rad{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .1em;line-height:1.15}
.rad>.rs{width:.8em;flex:none;align-self:stretch;height:auto;min-height:1.1em;overflow:visible}
.rad>.rb{border-top:1.5px solid currentColor;padding:.1em .12em 0 .08em;margin-top:.06em;display:inline-flex;align-items:center}
.rad>.ri{font-size:.6em;align-self:flex-start;margin-right:-.5em;margin-left:.1em;position:relative;top:.3em}
/* ---------- Aufgaben ---------- */
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 14px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
.task.done{border-color:var(--ok)}
.thead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.chip{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 10px;color:var(--mut)}
.ttitle{font-weight:700}
.thead .sp{flex:1}
.ttext{margin-bottom:8px}
.tfig{margin:8px 0;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.tfig svg{max-width:100%;height:auto}
.step{border-top:1px dashed var(--line);padding:10px 0 6px}
.step:first-child{border-top:none}
.sprompt{margin-bottom:6px}
.sn{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;background:var(--pri2);color:#fff;font-size:.8rem;align-items:center;justify-content:center;margin-right:8px;font-weight:700}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.ans,.sel,textarea.free,#notes,.cin{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
input.ans:focus,.sel:focus,textarea:focus,.cin:focus{border-color:var(--pri)}
input.ans{width:min(100%,360px);font-family:ui-monospace,Consolas,monospace}
.unit{color:var(--mut)}
.prev{min-height:1.7em;padding:3px 4px;color:var(--mut)}
.prev .m{color:var(--fg)}
textarea.free{width:100%;resize:vertical}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--pri)}
.opt.right{border-color:var(--ok);background:rgba(46,204,113,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,108,.12)}
.sbtn{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.92rem}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:6px}
.good{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.warnmsg{color:var(--warn)}
.hint{background:rgba(245,185,66,.12);border:1px solid var(--warn);border-radius:10px;padding:6px 12px;margin-top:6px;font-size:.95rem}
.expl{background:var(--panel2);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;padding:8px 14px;margin-top:6px}
.expl p{margin:4px 0}
.expl .ln{margin:6px 0}
.corr{margin-top:6px;font-weight:600}
.model{background:var(--panel2);border-left:4px solid var(--ok);padding:8px 14px;border-radius:0 10px 10px 0;margin-top:8px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);align-items:center}
.sum{margin-left:auto;font-weight:600}
.mk{display:inline-flex;width:1.4em;height:1.4em;border-radius:50%;background:var(--fg);color:var(--bg);font-weight:800;align-items:center;justify-content:center;font-size:.85em}
.more{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chips button{background:var(--panel2);border:1.5px solid var(--line);border-radius:20px;padding:4px 14px;cursor:pointer}
.chips button.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{font-size:1.4rem;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lnk{color:var(--pri);cursor:pointer;text-decoration:underline}
/* ---------- Taschenrechner ---------- */
.calc{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.ctop{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mut);margin:0 4px 6px}
.ctop b{color:var(--pri)}
.cscreen{background:#c9d8c0;color:#101a10;border-radius:12px;padding:8px 12px;border:3px solid #6c7a66;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;font-family:"Cambria Math","STIX Two Math",Cambria,serif}
.cscreen .m{font-size:1.25em}
.cscreen .m .par{opacity:1}
.cscreen .ph{color:#58634f}
#c-pretty{min-height:46px;display:flex;align-items:center;flex-wrap:wrap;overflow-x:auto;padding:4px 0}
#c-res{text-align:right;font-size:1.65rem;min-height:2.1rem;line-height:1.3}
#c-res .m{font-size:1.1em}
#c-res.err{font-size:1rem;color:#8b1d1d}
#c-res.pre{opacity:.5}
#c-res2{text-align:right;min-height:1.5em;font-size:.95rem;color:#2b3a28}
.cin{width:100%;margin:8px 0;font-family:ui-monospace,Consolas,monospace;font-size:.95rem;padding:6px 10px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.keys button{border:none;border-radius:10px;padding:0;height:42px;font-size:1rem;cursor:pointer;background:#2c3f63;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.35);user-select:none;display:flex;align-items:center;justify-content:center;font-family:"Cambria Math",Cambria,"Times New Roman",serif}
.keys button:active{transform:translateY(1px);box-shadow:none}
.keys button.op,.keys button.eq{font-family:system-ui,sans-serif;font-size:1.25rem}
.keys button.op sup{font-size:.6em}
.keys button.num{background:#3b4f78;font-size:1.15rem;font-family:system-ui,sans-serif}
.keys button.op{background:#5a3d9e}
.keys button.fn2{background:#223252;font-size:.85rem;font-family:system-ui,sans-serif}
.keys button.fn2.on{background:var(--warn);color:#000}
.keys button.eq{background:var(--pri2)}
.keys button.del{background:#a1344a}
.keys button sup{font-size:.65em;line-height:0}
.chist{margin-top:10px;max-height:150px;overflow:auto;font-size:.95rem}
.chist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 6px;border-radius:8px;cursor:pointer}
.chist div:hover{background:var(--panel2)}
.cact{display:flex;gap:6px;margin-top:8px}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.notes label{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px;font-size:.9rem}
#notes{width:100%;min-height:210px;resize:vertical;line-height:1.5}
/* ---------- responsive ---------- */
@media (max-width:1280px){
  .app{grid-template-columns:210px minmax(0,1fr);grid-template-areas:"top top" "nav main" "side side"}
  #side{position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "nav" "main" "side";padding:8px}
  #nav{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}
  #nav a{white-space:nowrap;flex:none}
  #nav a .st{display:none}

}
.fab{display:none}
@media (max-width:1280px){.fab{display:flex;position:fixed;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--pri2);color:#fff;border:none;font-size:1.4rem;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;z-index:10}}
svg text{font-family:system-ui,sans-serif}
</style>

<body>
<div class="app">
  <header class="top">
    <h1>⚛️ Physik-Training: Mechanische Schwingungen<small>Fadenpendel &amp; Federpendel · Übung für den Test · Stoff aus der Nextcloud (Physik › 1.1)</small></h1>
    <div class="gbar"><span id="g-txt"></span><div class="bar"><i id="g-bar"></i></div><button class="btn sm" id="g-reset" type="button">Fortschritt zurücksetzen</button></div>
  </header>
  <nav id="nav" aria-label="Lektionen"></nav>
  <main id="main"></main>
  <aside id="side">
    <section class="calc" aria-label="Taschenrechner">
      <div class="ctop"><span>🧮 Taschenrechner</span><b id="c-mode"></b></div>
      <div class="cscreen"><div id="c-pretty"></div><div><div id="c-res"></div><div id="c-res2"></div></div></div>
      <input id="c-in" class="cin" type="text" spellcheck="false" autocomplete="off" placeholder="z. B. 2*pi*sqrt(0,5/9,81) oder tippe mit den Tasten">
      <div class="keys" id="keys"></div>
      <div class="cact"><button class="btn sm" id="c-toans" type="button">↳ Ergebnis ins Antwortfeld</button><button class="btn sm" id="c-clearhist" type="button">Verlauf leeren</button></div>
      <div class="chist" id="c-hist"></div>
    </section>
    <section class="notes">
      <label><span id="n-label">📝 Notizen</span><button class="btn sm" id="n-clear" type="button">leeren</button></label>
      <textarea id="notes" placeholder="Hier ist Platz für Notizen, Rechnungen und Merksätze … (wird automatisch gespeichert)"></textarea>
    </section>
  </aside>
</div>
<button class="fab" id="fab" type="button" title="Zum Taschenrechner">🧮</button>
<script>
/* ===================== MATHE-ENGINE (Parser · Auswertung · schöne Darstellung) ===================== */
const M = (() => {
  const FN = ['sin','cos','tan','asin','acos','atan','sqrt','root','ln','log','abs','exp'];
  const GREEK = {'π':'pi','ω':'omega','φ':'phi','α':'alpha','Δ':'Delta','τ':'tau','λ':'lambda','μ':'mu','θ':'theta','ϑ':'theta','ε':'epsilon','ρ':'rho'};
  const SYM = {pi:'π',omega:'ω',phi:'φ',alpha:'α',Delta:'Δ',tau:'τ',lambda:'λ',mu:'μ',theta:'θ',epsilon:'ε',rho:'ρ'};
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function norm(s){
    return String(s).replace(/[−–—]/g,'-').replace(/[×·⋅∙]/g,'*').replace(/÷/g,'/')
      .replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,'sqrt')
      .replace(/[₀-₉]/g,c=>'_'+(c.charCodeAt(0)-0x2080)).replace(/ /g,' ');
  }

  /* ---------- Tokenizer ---------- */
  function tokenize(src){
    const s = norm(src), t = [];
    let i = 0;
    while(i < s.length){
      const c = s[i];
      if(/\s/.test(c)){ i++; continue; }
      const rest = s.slice(i);
      let m;
      if((m = /^(\d+(?:[.,]\d*)?|[.,]\d+)/.exec(rest))){ t.push({k:'num',s:m[0]}); i += m[0].length; continue; }
      if((m = /^\{([^}]*)\}/.exec(rest))){ t.push({k:'unit',s:m[1]}); i += m[0].length; continue; }
      if(GREEK[c]){
        let name = GREEK[c]; i++;
        const m2 = /^_[A-Za-z0-9]+/.exec(s.slice(i));
        if(m2){ name += m2[0]; i += m2[0].length; }
        t.push({k:'id',s:name}); continue;
      }
      if((m = /^[A-Za-zÄÖÜäöü]+(?:_[A-Za-z0-9ÄÖÜäöü]+)?/.exec(rest))){ t.push({k:'id',s:m[0]}); i += m[0].length; continue; }
      if(c === '≈' || c === '~' || '+-*/^()=;<>,!'.includes(c)){ t.push({k:'op',s:c === ',' ? ';' : c}); i++; continue; }
      throw new Error('Unbekanntes Zeichen „' + c + '“');
    }
    return t;
  }

  /* ---------- Parser (fehlertolerant: fehlende Operanden → Platzhalter, offene Klammern werden geschlossen) ---------- */
  function parse(src){
    const T = tokenize(src); let p = 0; const errs = [];
    const isOp = o => T[p] && T[p].k === 'op' && T[p].s === o;
    const REL = ['=','≈','<','>','~'];
    function relation(){
      let a = expr();
      while(T[p] && T[p].k === 'op' && REL.includes(T[p].s)){ const o = T[p++].s; a = {t:'bin',op:o,a,b:expr()}; }
      return a;
    }
    function expr(){
      let a = term();
      while(isOp('+') || isOp('-')){ const o = T[p++].s; a = {t:'bin',op:o,a,b:term()}; }
      return a;
    }
    function startsPrimary(){
      const k = T[p]; if(!k) return false;
      return k.k === 'num' || k.k === 'id' || k.k === 'unit' || (k.k === 'op' && k.s === '(');
    }
    function term(){
      let a = unary();
      for(;;){
        if(isOp('*')){ p++; a = {t:'bin',op:'*',a,b:unary()}; }
        else if(isOp('/')){ p++; a = {t:'bin',op:'/',a,b:unary()}; }
        else if(startsPrimary()){ a = {t:'imp',a,b:unary()}; }
        else break;
      }
      return a;
    }
    function unary(){
      if(isOp('-')){ p++; return {t:'neg',a:unary()}; }
      if(isOp('+')){ p++; return unary(); }
      return power();
    }
    function power(){
      let a = primary();
      if(isOp('^')){ p++; a = {t:'pow',a,b:unary()}; }
      return a;
    }
    function primary(){
      const k = T[p];
      if(!k) return {t:'empty'};
      if(k.k === 'num'){ p++; return {t:'num',s:k.s.replace('.',','),v:parseFloat(k.s.replace(',','.'))}; }
      if(k.k === 'unit'){ p++; return {t:'unit',s:k.s}; }
      if(k.k === 'op' && k.s === '('){
        p++; const a = relation(); let open = false;
        if(isOp(')')) p++; else open = true;
        return {t:'paren',a,open};
      }
      if(k.k === 'id'){
        p++;
        const low = k.s.toLowerCase();
        if(FN.includes(low)){
          if(isOp('(')){
            p++; const args = [relation()];
            while(isOp(';')){ p++; args.push(expr()); }
            if(isOp(')')) p++;
            return {t:'fn',name:low,args};
          }
          return {t:'fn',name:low,args:[unary()]};
        }
        return {t:'var',name:k.s};
      }
      return {t:'empty'};
    }
    const ast = relation();
    while(p < T.length){
      if(isOp(')')){ errs.push('Überzählige Klammer „)“'); p++; continue; }
      errs.push('Unerwartetes Zeichen „' + T[p].s + '“'); p++;
    }
    return {ast, errs};
  }

  /* ---------- Auswertung ---------- */
  const snap = v => Math.abs(v) < 1e-13 ? 0 : v;
  function lookup(name, env){
    if(env && Object.prototype.hasOwnProperty.call(env,name)) return env[name];
    const low = name.toLowerCase();
    if(low === 'pi') return Math.PI;
    if(name === 'e') return Math.E;
    if(low === 'ans'){ if(env && env.ans !== undefined) return env.ans; return 0; }
    if(/^[A-Za-z]{2,}$/.test(name)){
      let prod = 1;
      for(const ch of name){
        if(env && Object.prototype.hasOwnProperty.call(env,ch)) prod *= env[ch];

/* Aufgabe: {cat, title, text, figure, steps:[{type:'num'|'formula'|'choice'|'free', prompt, ans, ref, vars, unit, tol, options, select, explain, hints, model, points}]} */
function checkNum(st, raw){
  let v;

  const a = st.ans, tol = st.tol == null ? 0.02 : st.tol;

  const near = Math.abs(v - a) <= Math.abs(a) * 0.12;

function checkFormula(st, raw){
  const r = M.sameFormula(raw, st.ref, st.vars || []);

  return r.ok ? {ok:true} : {ok:false, msg:'Das ist nicht die gesuchte Formel.'};

function checkChoice(st, v){

function correctHtml(st){

  if(st.type === 'formula') return tx('$' + st.ref + '$');
  if(st.type === 'choice') return tx((Array.isArray(st.ans) ? st.ans : [st.ans]).map(i => st.options[i]).join(' / '));
  return '';
}

function buildStep(st, i, total, o, cb){

  const bCheck = h('button', 'btn pri', 'Prüfen'); bCheck.type = 'button';
  btns.append(bCheck);
  let finished = false, attempts = 0, hintI = 0, getVal = () => null, lock = () => {}, markCorrect = () => {};
  const ctl = {el, reveal: null};

  /* ----- Eingabe je nach Typ ----- */
  if(st.type === 'num' || st.type === 'formula'){
    const row = h('div', 'arow');
    const inp = document.createElement('input');
    inp.className = 'ans'; inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.placeholder = st.type === 'num' ? 'Zahl oder Rechnung …' : 'Formel eintippen, z. B. a*sqrt(b/c)';
    row.append(inp);
    if(st.unit) row.append(h('span', 'unit', tx('$ {' + st.unit + '}$')));
    body.append(row);
    const prev = h('div', 'prev'); body.append(prev);
    inp.addEventListener('input', () => { prev.innerHTML = inp.value.trim() ? M.render(inp.value) : ''; });
    inp.addEventListener('focus', () => { LAST = inp; });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); check(); } });
    getVal = () => inp.value.trim();
    lock = () => { inp.disabled = true; };
    ctl.focus = () => inp.focus();

    if(st.select){
      const sel = document.createElement('select'); sel.className = 'sel';
      sel.innerHTML = '<option value="">– auswählen –</option>' + st.options.map((t, k) => '<option value="' + k + '">' + M.esc(t) + '</option>').join('');
      body.append(sel);
      getVal = () => sel.value === '' ? null : +sel.value;
      lock = () => { sel.disabled = true; };
    } else {

function renderTask(task, o){

  if(task.title) head.append(h('span', 'ttitle', tx(task.title)));
  head.append(h('span', 'sp'));
  if(o.regen){
    const r = h('button', 'btn sm', '🔁 Neue Aufgabe'); r.type = 'button'; r.onclick = o.regen; head.append(r);
  }
  root.append(head);
  if(task.text) root.append(h('div', 'ttext', tx(task.text)));
  if(task.figure){ const f = h('div', 'tfig'); f.innerHTML = task.figure; root.append(f); }
  const stepsEl = h('div', 'steps'); root.append(stepsEl);
  const foot = h('div', 'tfoot'); root.append(foot);

  function mount(i){

    root.classList.add('done');
    const s = h('span', 'sum', (good === total ? '🎉 ' : '') + good + ' / ' + total + ' im ersten Versuch richtig');
    foot.append(s);
    sol && sol.remove();
    if(o.onDone) o.onDone({good, total, res});
  }
  let sol = null;
  if(!o.noSolution && !o.strict){
    sol = h('button', 'btn sm', '👁 Lösung anzeigen'); sol.type = 'button';
    sol.onclick = () => {
      let guard = 0;
      while(!finishedAll && guard++ < 30){ const c = ctls[cur]; if(c && c.reveal) c.reveal(); else break; }

  }

/* ---------- t-y-Diagramm ---------- */
function svgTY(o){

  const tick = o.tick || (Math.round(T * 10) % 5 === 0 ? 0.5 : 0.2);
  const tm = o.tmax || Math.ceil(2.4 * T / tick) * tick;
  const ymax = o.ymax || Math.ceil(A) + 1;
  const X = t => padL + t / tm * pw, Y = v => padT + ph / 2 - v / ymax * (ph / 2);
  let s = '<svg viewBox="0 0 ' + w + ' ' + hg + '" width="' + w + '" role="img">';

  }

  s += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + ph) + '" stroke="var(--fg)" stroke-width="1.6"/>';

  const pend = kind === 'faden' ? 'Fadenpendel' : 'Federpendel';
  const mode = pick(['single', 'single', 'single', 'double', 'double', 'trick', 'reverse']);
  const base = {cat:'faktor', catLabel:CATS.faktor, key:'factor:' + kind};
  const hints = ['Schau in die Formel: Steht die Größe unter der Wurzel – im Zähler oder im Nenner? Oder kommt sie gar nicht vor?',
    'Wurzelgesetz: Wirkt eine Größe mit „Wurzel“, musst du die Wurzel aus dem Faktor ziehen (√4 = 2, √9 = 3, √16 = 4, √25 = 5 …). Steht sie im Nenner, nimmst du den Kehrwert.'];

  if(mode === 'reverse'){
    const v = pick(nz), c = pick([2, 3, 4, 5, 0.5, 1/3, 0.25]);
    const m = Math.pow(c, 1 / EXP[v]);
    const expl = '<div class="ln">Formel: $' + formulaT + '$ → ' + (EXP[v] > 0 ? '$T ~ sqrt(' + v + ')$' : '$T ~ 1/sqrt(' + v + ')$') + '</div>' +
      '<div class="ln">Faktor für $T$ = ' + (EXP[v] > 0 ? '√(Faktor von $' + v + '$)' : '1/√(Faktor von $' + v + '$)') + ' = ' + ratStr(c) + '</div>' +
      '<div class="ln">Umgekehrt (beide Seiten quadrieren): ' + (EXP[v] > 0 ? 'Faktor von $' + v + '$ = $(' + ratStr(c) + ')^2$' : 'Faktor von $' + v + '$ = $1/(' + ratStr(c) + ')^2$') + ' = <b>' + ratStr(m) + '</b></div>';
    return Object.assign(base, {
      text: 'Ein ' + pend + ' soll mit einer Periodendauer schwingen, die <b>' + PHR.get(c) + '</b> ist wie vorher.',
      steps: [{type:'num', prompt: VNAME[v] + ' muss mit welchem Faktor multipliziert werden? (z. B. 9 oder 1/4)', ans: m, tol: .01, explain: expl, hints:
        ['Rückwärts denken: Wenn die Wurzel aus dem Faktor ' + ratStr(c) + ' ergeben soll, welcher Faktor steckt dann unter der Wurzel? Quadriere!', EXP[v] < 0 ? 'Die Größe steht im Nenner – dein Ergebnis muss also kleiner als 1 oder größer als 1 sein, je nachdem, ob T größer oder kleiner werden soll.' : 'Größe unter der Wurzel im Zähler: Wird T größer, muss auch die Größe größer werden.']}]
    });
  }
  let ch;
  if(mode === 'single') ch = [mkc(pick(nz))];
  else if(mode === 'trick') ch = [mkc(pick(zr))];
  else { const [a, b] = shuffle(nz).slice(0, 2); ch = [mkc(a), mkc(b)]; }
  const ask = Math.random() < .7 ? 'T' : 'f';
  let tot = 1, lines = ['<div class="ln">Formel: $' + formulaT + '$</div>'];
  ch.forEach(c => {
    const e = EXP[c.v], val = Math.pow(c.mult, e); tot *= val;
    if(e === 0){
      const why = c.v === 'm' ? 'Die Masse kürzt sich heraus (größere Masse → stärkere Rückstellkraft, aber auch mehr Trägheit).' : c.v === 'g' ? 'Beim Federpendel verschiebt $g$ nur die Ruhelage, nicht die Periodendauer.' : 'Die Amplitude spielt für $T$ keine Rolle (kleine Winkel bzw. ideale Feder).';
      lines.push('<div class="ln">$' + c.v + '$ kommt in der Formel nicht vor → Faktor <b>1</b>. ' + why + '</div>');
    } else {
      const fs = (e > 0 ? 'sqrt(' + ms(c) + ')' : '1/sqrt(' + ms(c) + ')');
      lines.push('<div class="ln">' + (e > 0 ? '$T ~ sqrt(' + c.v + ')$' : '$T ~ 1/sqrt(' + c.v + ')$') + ' → $' + c.v + '$ mal $' + ms(c) + '$ ergibt für $T$ den Faktor $' + fs + ' = ' + ratStr(val) + '$</div>');
    }
  });
  if(ch.length > 1) lines.push('<div class="ln">Beide Faktoren multiplizieren: $' + ch.map(c => ratStr(Math.pow(c.mult, EXP[c.v]))).join(' * ') + ' = ' + ratStr(tot) + '$</div>');
  let ans = tot;
  if(ask === 'f'){ ans = 1 / tot; lines.push('<div class="ln">Die Frage geht nach $f$: $f = 1/T$ → Kehrwert: $1/(' + ratStr(tot) + ') = ' + ratStr(ans) + '$</div>'); }
  lines.push('<div class="ln"><b>Ergebnis: ' + (ask === 'T' ? 'T' : 'f') + ' wird mit dem Faktor ' + ratStr(ans) + ' multipliziert.</b></div>');
  return Object.assign(base, {
    text: 'Ein ' + pend + ' schwingt mit der Periodendauer $T$ und der Frequenz $f$.<br>' + ch.map(c => VNAME[c.v] + ' ' + verb(c) + '.').join('<br>'),
    steps: [{type:'num', prompt: 'Mit welchem Faktor ändert sich ' + (ask === 'T' ? 'die Periodendauer $T$' : 'die Frequenz $f$') + '? (Zahl, Bruch wie 1/3 oder Dezimalzahl)', ans, tol: .01, explain: lines.join(''),
      hints: ask === 'f' ? ['Erst den Faktor für $T$ bestimmen, dann ist $f = 1/T$ der Kehrwert.'].concat(hints) : hints}]
  });
}

/* ---------- Proportionalitäten (Faktor rein – Faktor raus) ---------- */
function genProp(){
  const R = [{e:1, s:'y ~ x'}, {e:2, s:'y ~ x^2'}, {e:.5, s:'y ~ sqrt(x)'}, {e:-1, s:'y ~ 1/x'}, {e:-.5, s:'y ~ 1/sqrt(x)'}, {e:-2, s:'y ~ 1/x^2'}];
  const r = pick(R), sq = Math.abs(r.e) === .5;
  const k = sq ? pick([4, 9, 16, 25, 1/4, 1/9]) : pick([2, 3, 4, 5, 10, 1/2, 1/3]);
  const ans = Math.pow(k, r.e);
  const ks = k >= 1 ? String(k) : '1/' + Math.round(1 / k);
  return {cat:'prop', catLabel:CATS.prop, key:'prop', text: 'Es gilt der Zusammenhang $' + r.s + '$. Die Größe $x$ wird mit dem Faktor $' + ks + '$ multipliziert.',
    steps: [{type:'num', prompt: 'Mit welchem Faktor ändert sich $y$?', ans, tol: .01, hints: ['„Faktor rein – Faktor raus“: Setze den Faktor für x in den Zusammenhang ein.', sq ? 'Bei der Wurzel: Wurzel aus dem Faktor ziehen.' : 'Bei der Potenz: Faktor hoch den Exponenten.'],
      explain: '<div class="ln">Faktor rein – Faktor raus: Der Zusammenhang $' + r.s + '$ sagt: $y$ ändert sich um den Faktor, den man erhält, wenn man mit ' + (r.e === .5 ? 'der Wurzel aus' : r.e === -.5 ? 'dem Kehrwert der Wurzel aus' : r.e === 1 ? 'dem Faktor selbst' : r.e === 2 ? 'dem Quadrat von' : r.e === -1 ? 'dem Kehrwert von' : 'dem Kehrwert des Quadrats von') + ' $' + ks + '$ rechnet.</div>' +
        '<div class="ln">$' + (r.e === .5 ? 'sqrt(' + ks + ')' : r.e === -.5 ? '1/sqrt(' + ks + ')' : r.e === 1 ? ks : r.e === 2 ? '(' + ks + ')^2' : r.e === -1 ? '1/(' + ks + ')' : '1/(' + ks + ')^2') + ' = ' + ratStr(ans) + '$</div>'}]};
}

/* ---------- Quotienten-Test ---------- */
function genQuot(){
  const D = pick([10, 20, 25, 40]), ms = [0.1, 0.4, 0.9, 1.6].slice(0, 3 + (Math.random() < .5 ? 1 : 0));
  const rows = ms.map(m => { const T = Math.round(2 * PI * Math.sqrt(m / D) * 100) / 100; return {m, T}; });
  const tbl = '<table class="tbl" style="border-collapse:collapse;margin:8px 0"><tr><th style="border:1px solid var(--line);padding:4px 12px">$m$ in kg</th>' + rows.map(r => '<td style="border:1px solid var(--line);padding:4px 12px">' + fmt(r.m) + '</td>').join('') + '</tr><tr><th style="border:1px solid var(--line);padding:4px 12px">$T$ in s</th>' + rows.map(r => '<td style="border:1px solid var(--line);padding:4px 12px">' + fmt(r.T) + '</td>').join('') + '</tr></table>';
  const q = r => r.T * r.T / r.m;
  return {cat:'prop', catLabel:CATS.prop, key:'quot', text: 'Bei einem Federpendel wurden für verschiedene Massen die Periodendauern gemessen:' + tbl + 'Du vermutest $T ~ sqrt(m)$ und machst den <b>Quotienten-Test</b>.',
    steps: [0, 1].map(i => ({type:'num', prompt: 'Berechne $T^2/m$ für $m = ' + fmt(rows[i].m) + ' {kg}$.', ans: q(rows[i]), unit: 's^2/kg', tol: .03,
        explain: '<div class="ln">$T^2/m = (' + fmt(rows[i].T) + ' {s})^2 / (' + fmt(rows[i].m) + ' {kg}) = ' + fmt(rows[i].T * rows[i].T, 4) + ' {s^2} / ' + fmt(rows[i].m) + ' {kg} = ' + fmt(q(rows[i]), 4) + ' {s^2/kg}$</div>',
        hints: ['Erst $T$ quadrieren, dann durch $m$ teilen.']})).concat([{type:'choice', prompt: 'Was schließt du aus den Quotienten (alle ungefähr gleich)?', options: ['$T^2 ~ m$, also $T ~ sqrt(m)$ ✔', '$T ~ m$ (proportional)', '$T ~ 1/sqrt(m)$', '$T$ hängt nicht von $m$ ab'], ans: 0,
        explain: '<div class="ln">Ist $T^2/m$ (annähernd) konstant, dann ist $T^2 ~ m$ – das heißt $T ~ sqrt(m)$.</div><div class="ln">Der Quotient muss immer zur Vermutung passen: Vermutung $y ~ x$ → $y/x$ konstant; $y ~ sqrt(x)$ → $y^2/x$ konstant; $y ~ 1/x$ → $y·x$ konstant.</div>'}])};
}

/* ---------- Größen & Einheiten ---------- */
function genUnits(){
  const v = pick(['fT', 'Tf', 'nt', 'omega', 'count']);

  }
  if(v === 'Tf'){
    const f = pick([2, 4, 5, 10, 50, 0.5, 0.25, 20, 100]);
    return Object.assign(base, {text: 'Eine Stimmgabel-ähnliche Schwingung hat die Frequenz $f = ' + fmt(f) + ' {Hz}$.', steps: [{type:'num', prompt: 'Berechne die Periodendauer $T$.', ans: 1 / f, unit: 's', tol: .01, hints: ['$T = 1/f$'], explain: '<div class="ln">$T = 1/f = 1/(' + fmt(f) + ' {Hz}) = ' + fmt(1 / f) + ' {s}$</div>'}]});
  }
  if(v === 'nt'){
    const T = pick([0.5, 0.8, 1, 1.2, 1.5, 2, 2.5]), n = pick([10, 20, 5, 30]), t = Math.round(n * T * 100) / 100;
    return Object.assign(base, {text: 'Für $' + n + '$ vollständige Schwingungen misst man mit der Stoppuhr $' + fmt(t) + ' {s}$.',
      steps: [{type:'num', prompt: 'Wie groß ist die Periodendauer $T$?', ans: t / n, unit: 's', tol: .01, hints: ['Zeit für alle Schwingungen geteilt durch die Anzahl.'], explain: '<div class="ln">$T = t/n = ' + fmt(t) + ' {s} / ' + n + ' = ' + fmt(t / n) + ' {s}$</div><div class="ln">Tipp aus dem Versuch: lieber 10 Schwingungen stoppen – die Reaktionszeit fällt dann kaum ins Gewicht.</div>'},
        {type:'num', prompt: 'Und die Frequenz $f$?', ans: n / t, unit: 'Hz', tol: .01, explain: '<div class="ln">$f = 1/T = 1/(' + fmt(t / n) + ' {s}) = ' + fmt(n / t) + ' {Hz}$</div>'}]});
  }
  if(v === 'omega'){
    const f = pick([0.5, 1, 2, 4, 5, 10]);
    return Object.assign(base, {text: 'Ein Pendel schwingt mit $f = ' + fmt(f) + ' {Hz}$.', steps: [{type:'num', prompt: 'Berechne die Kreisfrequenz $omega$.', ans: 2 * PI * f, unit: 'rad/s', tol: .01, hints: ['$omega = 2*pi*f$ (Taschenrechner: π-Taste).'], explain: '<div class="ln">$omega = 2*pi*f = 2*pi*' + fmt(f) + ' {Hz} = ' + fmt(2 * PI * f, 4) + ' {rad/s}$</div>'}]});
  }
  const f = pick([0.5, 2, 4, 5, 10]), t = pick([10, 20, 30, 60]);
  return Object.assign(base, {text: 'Ein Körper schwingt mit $f = ' + fmt(f) + ' {Hz}$.', steps: [{type:'num', prompt: 'Wie viele vollständige Schwingungen macht er in $' + t + ' {s}$?', ans: f * t, tol: .01, hints: ['Die Frequenz sagt, wie viele Schwingungen pro Sekunde passieren.'], explain: '<div class="ln">$n = f*t = ' + fmt(f) + ' {Hz} * ' + t + ' {s} = ' + fmt(f * t) + '$</div>'}]});
}

  {q:'die Periodendauer $T$ des <b>Federpendels</b>', ref:'2*pi*sqrt(m/D)', vars:['m','D'], ex:'Federpendel: $T = 2*pi*sqrt(m/D)$. Unter der Wurzel: Masse $m$ (Zähler), Federkonstante $D$ (Nenner).'},

  {q:'die Masse $m$ eines Federpendels aus $D$ und $T$', ref:'D*T^2/(4*pi^2)', vars:['D','T'], ex:'<div class="ln">$T^2 = 4*pi^2*m/D$</div><div class="ln">$m = D*T^2/(4*pi^2)$</div>'},

  {q:'die Eigenkreisfrequenz $omega$ eines Federpendels aus $D$ und $m$', ref:'sqrt(D/m)', vars:['D','m'], ex:'Aus $m*a = -D*x$ folgt $omega = sqrt(D/m)$ – und mit $T = 2*pi/omega$ die bekannte Formel $T = 2*pi*sqrt(m/D)$.'},
  {q:'die potenzielle Energie (Spannenergie) der Feder bei Auslenkung $x$', ref:'1/2*D*x^2', vars:['D','x'], ex:'$E_pot = 1/2*D*x^2$. Maximal an den Umkehrpunkten, null in der Ruhelage.'},
  {q:'die kinetische Energie eines Körpers mit Masse $m$ und Geschwindigkeit $v$', ref:'1/2*m*v^2', vars:['m','v'], ex:'$E_kin = 1/2*m*v^2$. Maximal beim Durchgang durch die Ruhelage.'},
  {q:'die Dämpfungskraft $F_d$ (Konstante $b$, Geschwindigkeit $v$)', ref:'-b*v', vars:['b','v'], ex:'$F_d = -b*v$: proportional zur Geschwindigkeit und der Bewegung entgegengerichtet.'}

function genFormula(idx){

/* ---------- Rechnen mit dem Fadenpendel ---------- */
const PLANETS = [{n:'auf der Erde', g:9.81}, {n:'auf der Erde', g:9.81}, {n:'auf der Erde', g:9.81}, {n:'auf dem Mond', g:1.62}, {n:'auf dem Mars', g:3.71}];
function genFadenT(){
  const l = pick([0.25, 0.4, 0.5, 0.6, 0.8, 1, 1.2, 1.5, 2, 2.5, 4]), pl = pick(PLANETS);
  const q = l / pl.g, w = Math.sqrt(q), T = 2 * PI * w, withF = Math.random() < .5;
  const steps = [
    {type:'formula', prompt: 'Welche Formel gilt für die Periodendauer $T$ des Fadenpendels?', ref:'2*pi*sqrt(l/g)', vars:['l','g'], hints: ['$T$ hängt von $l$ und $g$ ab – nicht von der Masse.'], explain: '$T = 2*pi*sqrt(l/g)$ – die Masse taucht nicht auf.'},
    {type:'num', prompt: 'Setze ein und berechne zuerst den Bruch unter der Wurzel: $l/g$ = ?', ans:q, unit:'s^2', tol:.02, hints: ['Länge in m, g in m/s² → Ergebnis in s².'], explain: '<div class="ln">$l/g = ' + fmt(l) + ' {m} / ' + fmt(pl.g) + ' {m/s^2} = ' + fmt(q, 4) + ' {s^2}$</div>'},
    {type:'num', prompt: 'Ziehe die Wurzel: $sqrt(l/g)$ = ?', ans:w, unit:'s', tol:.02, hints: ['Taschenrechner: √-Taste, dann das Ergebnis aus Schritt 2 einsetzen (oder Ans benutzen).'], explain: '<div class="ln">$sqrt(' + fmt(q, 4) + ' {s^2}) = ' + fmt(w, 4) + ' {s}$</div>'},
    {type:'num', prompt: 'Multipliziere mit $2*pi$: $T$ = ?', ans:T, unit:'s', tol:.02, hints: ['Vergiss den Faktor 2π nicht.'], explain: '<div class="ln">$T = 2*pi*' + fmt(w, 4) + ' {s} = ' + fmt(T, 4) + ' {s}$</div>'}
  ];
  if(withF) steps.push({type:'num', prompt: 'Wie groß ist die Frequenz $f$?', ans:1 / T, unit:'Hz', tol:.02, hints: ['$f = 1/T$'], explain: '<div class="ln">$f = 1/T = 1/(' + fmt(T, 4) + ' {s}) = ' + fmt(1 / T, 4) + ' {Hz}$</div>'});
  return {cat:'rechnen_faden', catLabel:CATS.rechnen_faden, key:'fadenT', text: 'Ein Fadenpendel der Länge $l = ' + fmt(l) + ' {m}$ schwingt ' + pl.n + ' ($g = ' + fmt(pl.g) + ' {m/s^2}$). Berechne ' + (withF ? 'Periodendauer und Frequenz' : 'die Periodendauer') + ' Schritt für Schritt.', steps};
}
function genFadenL(){
  const T = pick([1, 1.5, 2, 2.5, 3, 4]), pl = pick(PLANETS), l = pl.g * T * T / (4 * PI * PI);
  return {cat:'rechnen_faden', catLabel:CATS.rechnen_faden, key:'fadenL', text: 'Ein Fadenpendel soll ' + pl.n + ' ($g = ' + fmt(pl.g) + ' {m/s^2}$) die Periodendauer $T = ' + fmt(T) + ' {s}$ haben. Wie lang muss der Faden sein?', steps: [
    {type:'formula', prompt: 'Stelle $T = 2*pi*sqrt(l/g)$ nach $l$ um. Wie lautet die Formel für $l$?', ref:'g*T^2/(4*pi^2)', vars:['g','T'], hints: ['Zuerst beide Seiten quadrieren, um die Wurzel loszuwerden.', 'Dann nach $l$ auflösen: mit $g$ malnehmen und durch $4π^2$ teilen.'],
      explain: '<div class="ln">$T = 2*pi*sqrt(l/g)$</div><div class="ln">Quadrieren: $T^2 = 4*pi^2*l/g$</div><div class="ln">Mal $g$, geteilt durch $4*pi^2$: $l = g*T^2/(4*pi^2)$</div>'},
    {type:'num', prompt: 'Berechne $T^2$.', ans:T * T, unit:'s^2', tol:.01, explain: '<div class="ln">$T^2 = (' + fmt(T) + ' {s})^2 = ' + fmt(T * T) + ' {s^2}$</div>'},
    {type:'num', prompt: 'Berechne den Nenner $4*pi^2$.', ans:4 * PI * PI, tol:.01, hints: ['π² ≈ 9,87 – am besten mit der π-Taste und x²-Taste rechnen.'], explain: '<div class="ln">$4*pi^2 = 4 * 9,8696 = 39,478$</div>'},
    {type:'num', prompt: 'Setze alles ein: $l$ = ?', ans:l, unit:'m', tol:.02, explain: '<div class="ln">$l = ' + fmt(pl.g) + ' {m/s^2} * ' + fmt(T * T) + ' {s^2} / 39,478 = ' + fmt(l, 4) + ' {m}$</div>' + (T === 2 && pl.g === 9.81 ? '<div class="ln">Das ist das <b>Sekundenpendel</b>: ca. 1 m lang.</div>' : '')}]};
}
function genFadenG(){
  const l = pick([0.5, 0.6, 0.8, 1, 1.2]), n = pick([10, 10, 20]), gt = 9.81 * rnd(0.96, 1.04);
  const t = Math.round(n * 2 * PI * Math.sqrt(l / gt) * 10) / 10, T = t / n, g = 4 * PI * PI * l / (T * T);
  return {cat:'rechnen_faden', catLabel:CATS.rechnen_faden, key:'fadenG', text: 'Im Versuch misst man bei einem Fadenpendel der Länge $l = ' + fmt(l) + ' {m}$ für $' + n + '$ Schwingungen die Zeit $t = ' + fmt(t) + ' {s}$. Bestimme daraus die Fallbeschleunigung $g$.', steps: [

    {type:'num', prompt: 'Berechne $g$.', ans:g, unit:'m/s^2', tol:.03, hints: ['Zähler und Nenner getrennt ausrechnen, dann teilen.'], explain: '<div class="ln">$g = 4*pi^2*' + fmt(l) + ' {m} / (' + fmt(T, 4) + ' {s})^2 = ' + fmt(4 * PI * PI * l, 4) + ' / ' + fmt(T * T, 4) + ' = ' + fmt(g, 4) + ' {m/s^2}$</div><div class="ln">Das passt gut zu $g ≈ 9,81 {m/s^2}$ ✓</div>'}]};

function genFadenMond(){

    {type:'num', prompt: 'Periodendauer auf der Erde?', ans:Te, unit:'s', tol:.02, explain: '<div class="ln">$T = 2*pi*sqrt(' + fmt(l) + '/9,81) = ' + fmt(Te, 4) + ' {s}$</div>'},
    {type:'num', prompt: 'Periodendauer auf dem Mond?', ans:Tm, unit:'s', tol:.02, explain: '<div class="ln">$T = 2*pi*sqrt(' + fmt(l) + '/1,62) = ' + fmt(Tm, 4) + ' {s}$</div>'},

const genFadenAny = () => pick([genFadenT, genFadenT, genFadenL, genFadenG, genFadenN, genFadenMond])();

/* ---------- Rechnen mit dem Federpendel ---------- */
function genFederT(){
  const m = pick([0.1, 0.2, 0.25, 0.4, 0.5, 1, 2]), D = pick([5, 10, 20, 25, 40, 50, 100]);
  const q = m / D, w = Math.sqrt(q), T = 2 * PI * w, withF = Math.random() < .5;
  const steps = [
    {type:'formula', prompt: 'Welche Formel gilt für die Periodendauer $T$ des Federpendels?', ref:'2*pi*sqrt(m/D)', vars:['m','D'], hints: ['$T$ hängt von der Masse $m$ und der Federkonstanten $D$ ab.'], explain: '$T = 2*pi*sqrt(m/D)$'},
    {type:'num', prompt: 'Berechne zuerst den Bruch unter der Wurzel: $m/D$ = ?', ans:q, unit:'s^2', tol:.02, hints: ['kg geteilt durch N/m ergibt s² (denn 1 N = 1 kg·m/s²).'], explain: '<div class="ln">$m/D = ' + fmt(m) + ' {kg} / ' + fmt(D) + ' {N/m} = ' + fmt(q, 4) + ' {s^2}$</div>'},
    {type:'num', prompt: 'Wurzel ziehen: $sqrt(m/D)$ = ?', ans:w, unit:'s', tol:.02, explain: '<div class="ln">$sqrt(' + fmt(q, 4) + ') = ' + fmt(w, 4) + ' {s}$</div>'},
    {type:'num', prompt: 'Mal $2*pi$: $T$ = ?', ans:T, unit:'s', tol:.02, explain: '<div class="ln">$T = 2*pi*' + fmt(w, 4) + ' {s} = ' + fmt(T, 4) + ' {s}$</div>'}
  ];
  if(withF) steps.push({type:'num', prompt: 'Frequenz $f$?', ans:1 / T, unit:'Hz', tol:.02, explain: '<div class="ln">$f = 1/T = 1/(' + fmt(T, 4) + ' {s}) = ' + fmt(1 / T, 4) + ' {Hz}$</div>'});
  return {cat:'rechnen_feder', catLabel:CATS.rechnen_feder, key:'federT', text: 'Ein Körper der Masse $m = ' + fmt(m) + ' {kg}$ hängt an einer Feder mit der Federkonstanten $D = ' + fmt(D) + ' {N/m}$. Berechne ' + (withF ? 'Periodendauer und Frequenz' : 'die Periodendauer') + '.', steps};
}
function genFederD(){
  const m = pick([0.1, 0.2, 0.25, 0.5, 1, 2]), T = pick([0.5, 0.8, 1, 1.5, 2]), D = 4 * PI * PI * m / (T * T);
  return {cat:'rechnen_feder', catLabel:CATS.rechnen_feder, key:'federD', text: 'Ein Körper mit $m = ' + fmt(m) + ' {kg}$ soll an einer Feder mit der Periodendauer $T = ' + fmt(T) + ' {s}$ schwingen. Welche Federkonstante $D$ braucht man?', steps: [
    {type:'formula', prompt: 'Stelle $T = 2*pi*sqrt(m/D)$ nach $D$ um.', ref:'4*pi^2*m/T^2', vars:['m','T'], hints: ['Quadrieren: $T^2 = 4*pi^2*m/D$.', 'Dann mit $D$ multiplizieren und durch $T^2$ teilen.'], explain: '<div class="ln">$T^2 = 4*pi^2*m/D$</div><div class="ln">Mal $D$, geteilt durch $T^2$: $D = 4*pi^2*m/T^2$</div>'},
    {type:'num', prompt: 'Zähler: $4*pi^2*m$ = ?', ans:4 * PI * PI * m, tol:.02, explain: '<div class="ln">$4*pi^2*' + fmt(m) + ' = ' + fmt(4 * PI * PI * m, 4) + '$</div>'},
    {type:'num', prompt: 'Nenner: $T^2$ = ?', ans:T * T, unit:'s^2', tol:.01, explain: '<div class="ln">$(' + fmt(T) + ' {s})^2 = ' + fmt(T * T) + ' {s^2}$</div>'},
    {type:'num', prompt: 'Teile: $D$ = ?', ans:D, unit:'N/m', tol:.02, explain: '<div class="ln">$D = ' + fmt(4 * PI * PI * m, 4) + ' / ' + fmt(T * T) + ' = ' + fmt(D, 4) + ' {N/m}$</div>'}]};
}
function genFederM(){
  const D = pick([10, 20, 25, 40, 50, 100]), T = pick([0.5, 1, 1.5, 2]), m = D * T * T / (4 * PI * PI);
  return {cat:'rechnen_feder', catLabel:CATS.rechnen_feder, key:'federM', text: 'Eine Feder ($D = ' + fmt(D) + ' {N/m}$) schwingt mit einem Körper mit der Periodendauer $T = ' + fmt(T) + ' {s}$. Welche Masse hat der Körper?', steps: [
    {type:'formula', prompt: 'Stelle die Formel nach $m$ um.', ref:'D*T^2/(4*pi^2)', vars:['D','T'], hints: ['Quadrieren, dann mit $D$ multiplizieren und durch $4π^2$ teilen.'], explain: '<div class="ln">$T^2 = 4*pi^2*m/D$</div><div class="ln">$m = D*T^2/(4*pi^2)$</div>'},
    {type:'num', prompt: 'Berechne $m$.', ans:m, unit:'kg', tol:.02, hints: ['Erst $D*T^2$ ausrechnen, dann durch 39,48 teilen.'], explain: '<div class="ln">$m = ' + fmt(D) + ' {N/m} * ' + fmt(T * T) + ' {s^2} / 39,478 = ' + fmt(D * T * T, 4) + ' / 39,478 = ' + fmt(m, 4) + ' {kg}$</div>'}]};
}
function genFederHooke(){
  const D = pick([10, 20, 25, 40, 50, 100]), x = pick([0.05, 0.1, 0.2]), F = D * x, m = pick([0.2, 0.5, 1]);
  const T = 2 * PI * Math.sqrt(m / D);
  return {cat:'rechnen_feder', catLabel:CATS.rechnen_feder, key:'federHooke', text: 'Zieht man mit der Kraft $F = ' + fmt(F) + ' {N}$ an einer Feder, dehnt sie sich um $x = ' + fmt(x * 100) + ' {cm}$. Danach hängt man einen Körper mit $m = ' + fmt(m) + ' {kg}$ daran und lässt ihn schwingen.', steps: [
    {type:'num', prompt: 'Bestimme die Federkonstante $D$ aus $F = D*x$ (Achtung: $x$ in m!).', ans:D, unit:'N/m', tol:.01, hints: ['$D = F/x$ – rechne die Auslenkung zuerst von cm in m um.'], explain: '<div class="ln">$x = ' + fmt(x * 100) + ' {cm} = ' + fmt(x) + ' {m}$</div><div class="ln">$D = F/x = ' + fmt(F) + ' {N} / ' + fmt(x) + ' {m} = ' + fmt(D) + ' {N/m}$</div>'},
    {type:'num', prompt: 'Berechne nun die Periodendauer $T$ des Federpendels.', ans:T, unit:'s', tol:.02, hints: ['$T = 2*pi*sqrt(m/D)$ mit dem gerade berechneten $D$.'], explain: '<div class="ln">$T = 2*pi*sqrt(' + fmt(m) + ' / ' + fmt(D) + ') = 2*pi*' + fmt(Math.sqrt(m / D), 4) + ' = ' + fmt(T, 4) + ' {s}$</div>'}]};
}
const genFederAny = () => pick([genFederT, genFederT, genFederD, genFederM, genFederHooke])();

/* ---------- t-y-Diagramm ablesen ---------- */
function genGraph(){
  const T = pick([0.4, 0.6, 0.8, 1, 1.2, 1.5, 2, 2.5, 3, 4]), A = pick([2, 3, 4, 5]), damped = Math.random() < .3;
  const tick = Math.round(T * 10) % 5 === 0 ? 0.5 : 0.2;
  let t0 = 0;
  if(!damped){
    const opts = [0, tick], q = T / 4 / tick; if(Math.abs(q - Math.round(q)) < 1e-9) opts.push(T / 4);
    t0 = pick(opts);
  }
  const fig = svgTY({A, T, t0, damp: damped ? T * pick([1.5, 2, 3]) : 0, env: damped, tick}).svg;
  const steps = [
    {type:'choice', prompt: 'Ist die Schwingung gedämpft oder ungedämpft?', options: ['ungedämpft (Amplitude bleibt gleich)', 'gedämpft (Amplitude nimmt ab)'], ans: damped ? 1 : 0, explain: '<div class="ln">Prüfe, ob die Maxima von Periode zu Periode kleiner werden. ' + (damped ? 'Hier werden sie kleiner (gestrichelte Hüllkurve) → <b>gedämpft</b>.' : 'Hier bleiben alle Maxima gleich hoch → <b>ungedämpft</b> (Modell).') + '</div>'},
    {type:'num', prompt: damped ? 'Lies die Amplitude $A$ des <b>ersten</b> Ausschlags ab.' : 'Lies die Amplitude $A$ ab.', ans:A, unit:'cm', tol:.01, hints: ['Die Amplitude misst man von der Nulllinie ($y = 0$) bis zum höchsten Punkt – nicht bis zum tiefsten!'], explain: '<div class="ln">Von der Nulllinie bis zum ersten Maximum: $A = ' + A + ' {cm}$. (Der Abstand zwischen höchstem und tiefstem Punkt wäre $2A = ' + 2 * A + ' {cm}$ – das ist nicht die Amplitude.)</div>'},
    {type:'num', prompt: 'Lies die Periodendauer $T$ ab.', ans:T, unit:'s', tol:.02, hints: ['Suche zwei benachbarte Maxima und lies den zeitlichen Abstand auf der t-Achse ab.', 'Du kannst auch zwei gleichsinnige Nulldurchgänge nehmen. Zwei direkt aufeinanderfolgende Nulldurchgänge sind nur $T/2$ auseinander.'], explain: '<div class="ln">Zwei benachbarte Maxima: bei $t = ' + fmt(+t0.toFixed(3)) + ' {s}$ und $t = ' + fmt(+(t0 + T).toFixed(3)) + ' {s}$ → $T = ' + fmt(+(t0 + T).toFixed(3)) + ' {s} - ' + fmt(+t0.toFixed(3)) + ' {s} = ' + fmt(T) + ' {s}$</div>'},
    {type:'num', prompt: 'Berechne die Frequenz $f$.', ans:1 / T, unit:'Hz', tol:.02, hints: ['$f = 1/T$'], explain: '<div class="ln">$f = 1/T = 1/(' + fmt(T) + ' {s}) = ' + fmt(1 / T, 4) + ' {Hz}$</div>'}
  ];
  return {cat:'diagramm', catLabel:CATS.diagramm, key:'graph', text: 'Das Bild zeigt das t-y-Diagramm einer Schwingung. Zähle die Kästchen genau!', figure: fig, steps};
}

  ['Die <b>Beschleunigung</b> ist null', 0, '$m*a = -D*x$: Bei $x = 0$ (Ruhelage) ist die Kraft und damit die Beschleunigung null.'],
  ['Die <b>rücktreibende Kraft</b> ist am größten', 1, '$F_r = -D*x$ wird bei größtem $x$ (= Amplitude) maximal.'],

  ['Die <b>kinetische Energie</b> ist null', 1, 'An den Umkehrpunkten ist $v = 0$, also $E_kin = 0$; die gesamte Energie steckt als $E_pot$ in der Auslenkung.'],
  ['Die Auslenkung ist null', 0, 'Das ist die Definition der Ruhelage (Gleichgewichtslage).'],
  ['Beim Federpendel gilt: Gewichtskraft und Federkraft sind <b>gleich groß</b>', 0, 'In der Ruhelage herrscht Kräftegleichgewicht – die resultierende Kraft ist null.']

function genPos(){

function genEnergy(){
  const D = pick([20, 50, 100, 200]), A = pick([0.05, 0.1, 0.2]), m = pick([0.2, 0.5, 1, 2]);
  const E = 0.5 * D * A * A, v = Math.sqrt(2 * E / m);
  return {cat:'kraefte', catLabel:CATS.kraefte, key:'energy', title:'Energie beim Federpendel (anspruchsvoll)', text: 'Ein Federpendel ($D = ' + fmt(D) + ' {N/m}$, $m = ' + fmt(m) + ' {kg}$) wird um $A = ' + fmt(A * 100) + ' {cm}$ ausgelenkt und losgelassen. Reibung wird vernachlässigt.', steps: [
    {type:'num', prompt: 'Wie groß ist die Spannenergie am Umkehrpunkt ($x = A$)?', ans:E, unit:'J', tol:.02, hints: ['$E_pot = 1/2*D*x^2$ – Auslenkung in Meter einsetzen!'], explain: '<div class="ln">$E_pot = 1/2*D*A^2 = 1/2 * ' + fmt(D) + ' {N/m} * (' + fmt(A) + ' {m})^2 = ' + fmt(E, 4) + ' {J}$</div>'},
    {type:'num', prompt: 'Wie groß ist die kinetische Energie beim Durchgang durch die Ruhelage?', ans:E, unit:'J', tol:.02, hints: ['Ohne Dämpfung bleibt $E_kin + E_pot$ konstant. In der Ruhelage ist $E_pot = 0$.'], explain: '<div class="ln">Energieerhaltung: $E_kin + E_pot = konstant$. In der Ruhelage ist $E_pot = 0$, also ist $E_kin,max = E_pot,max = ' + fmt(E, 4) + ' {J}$.</div>'},
    {type:'num', prompt: 'Wie schnell ist der Körper dann (maximale Geschwindigkeit)?', ans:v, unit:'m/s', tol:.02, hints: ['$E_kin = 1/2*m*v^2$ nach $v$ auflösen: $v = sqrt(2*E/m)$.'], explain: '<div class="ln">$1/2*m*v^2 = E$ → $v = sqrt(2*E/m) = sqrt(2*' + fmt(E, 4) + ' / ' + fmt(m) + ') = ' + fmt(v, 4) + ' {m/s}$</div>'}]};
}

    'Konstante Amplitude, keine Energiezufuhr: <b>ungedämpft</b> (nur ein Modell).',

function genMC(tags, seen){
  const set = tags ? tags.split(',') : null;
  let pool = BANK.map((b, i) => [b, i]).filter(([b]) => !set || set.includes(b[0]));
  if(seen){ const fresh = pool.filter(([, i]) => !seen.has(i)); if(fresh.length) pool = fresh; }
  const [b, idx] = pick(pool);
  if(seen) seen.add(idx);
  const opts = shuffle([b[2]].concat(b[3]));
  return {cat:'konzept', catLabel:CATS.konzept, key:'mc:' + (tags || ''),
    steps: [{type:'choice', prompt: b[1], options: opts, ans: opts.indexOf(b[2]), explain: '<div class="ln">' + b[4] + '</div>', hints: []}]};
}

   theory:`<ul><li><b>Schulversuch:</b> Zeit für <b>10 Schwingungen</b> stoppen, durch 10 teilen.</li><li><b>Beschleunigungssensoren</b> (Trägheit einer inneren Masse, auch im Smartphone), <b>Wirbelstrom-/Laser-Wegsensoren</b> (liefern direkt die t-y-Kurve), <b>FFT</b> (zerlegt in Sinus-Frequenzen).</li></ul>
<h3>Foucaultsches Pendel</h3>
<p>Sehr langes Pendel, das die <b>Erddrehung</b> zeigt: Es behält wegen der Trägheit seine Schwingungsebene, die Erde dreht sich darunter weg. Drehzeit $T = 24 {h}/sin(phi)$: Pol 24 h, Berlin (52,5°) ca. 30 h, Äquator keine Drehung. Nordhalbkugel: im Uhrzeigersinn. 1851 in Paris (Foucault).</p>`,
   items:['mc:mess','mc:mess','mc:mess','free:messen','free:foucault'], more:['mc:mess']}
];
const SPECIAL = [
  {id:'zufall', icon:'🎲', title:'Zufalls-Aufgaben', sub:''},
  {id:'test', icon:'📝', title:'Testsimulation', sub:''}
];
const CAT_LESSON = {faktor:'l5', rechnen_faden:'l6', rechnen_feder:'l8', formel:'l2', diagramm:'l3', kraefte:'l9', konzept:'l10', einheiten:'l2', prop:'l4', frei:'l1'};

/* ===================== FORTSCHRITT ===================== */
let prog = S.get('prog', {}), catProg = S.get('catprog', {});
function rec(id, cat, good, total){
  (prog[id] = prog[id] || {n:0, c:0}); prog[id].n += total; prog[id].c += good;
  (catProg[cat] = catProg[cat] || {n:0, c:0}); catProg[cat].n += total; catProg[cat].c += good;
  S.set('prog', prog); S.set('catprog', catProg); updNav(); updGlobal();
}
function totals(){ let n = 0, c = 0; Object.values(prog).forEach(p => { n += p.n; c += p.c; }); return {n, c}; }
function updGlobal(){
  const t = totals();
  document.getElementById('g-txt').textContent = t.n ? 'Trefferquote ' + Math.round(100 * t.c / t.n) + ' % (' + t.c + '/' + t.n + ' Teilaufgaben)' : 'Noch nichts gerechnet – los geht’s!';
  document.getElementById('g-bar').style.width = (t.n ? 100 * t.c / t.n : 0) + '%';
}
document.getElementById('g-reset').addEventListener('click', () => {
  if(!confirm('Gesamten Fortschritt zurücksetzen? (Notizen bleiben erhalten)')) return;
  prog = {}; catProg = {}; S.set('prog', prog); S.set('catprog', catProg); updNav(); updGlobal(); route();
});

/* ===================== NAVIGATION ===================== */
const nav = document.getElementById('nav'), main = document.getElementById('main');
function buildNav(){
  nav.innerHTML = '';
  const add = (id, icon, title) => {
    const a = h('a', null, '<span class="ic">' + icon + '</span><span class="tx">' + title + '</span><span class="st"></span>');
    a.dataset.id = id; a.href = '#' + id; nav.append(a);
  };
  add('start', '🏁', 'Start & Formelblatt');
  LESSONS.forEach(L => add(L.id, L.icon, L.title));
  nav.append(h('div', 'sep'));
  SPECIAL.forEach(L => add(L.id, L.icon, L.title));
  updNav();
}
function updNav(){
  nav.querySelectorAll('a').forEach(a => {
    const p = prog[a.dataset.id]; a.querySelector('.st').textContent = p && p.n ? Math.round(100 * p.c / p.n) + ' %' : '';
    a.classList.toggle('on', a.dataset.id === currentId);
  });
}
let currentId = 'start';

/* ===================== NOTIZEN ===================== */
const notesEl = document.getElementById('notes'), notesLabel = document.getElementById('n-label');
let notesKey = 'start', notesTimer = null;
function loadNotes(id, name){
  notesKey = id; notesEl.value = S.get('note_' + id, '');
  notesLabel.textContent = '📝 Notizen – ' + name;
}
notesEl.addEventListener('input', () => { clearTimeout(notesTimer); notesTimer = setTimeout(() => S.set('note_' + notesKey, notesEl.value), 300); });
document.getElementById('n-clear').addEventListener('click', () => { if(notesEl.value && !confirm('Notizen dieser Seite löschen?')) return; notesEl.value = ''; S.set('note_' + notesKey, ''); });
document.getElementById('fab').addEventListener('click', () => document.getElementById('side').scrollIntoView({behavior:'smooth'}));

/* ===================== SEITEN ===================== */
function placeTask(key, host, lessonId, seen){
  const t = makeTask(key, seen);
  const regenOk = !/^(free:|diag:(feder|faden|ty|tydamp))/.test(key);
  const node = renderTask(t, {
    regen: regenOk ? () => placeTask(key, host, lessonId, seen) : null,
    onDone: r => rec(lessonId, t.cat, r.good, r.total)
  });
  host.replaceChildren(node);
}
function renderLesson(L){
  main.innerHTML = '';
  main.append(h('div', 'card', '<h1 class="lt">' + L.icon + ' ' + L.title + '</h1><p class="sub" style="margin:0">' + L.sub + '</p>'));
  const d = h('details', 'theory'); d.open = true;
  d.innerHTML = '<summary>📖 Das musst du wissen (Kurzfassung)</summary><div class="tb">' + tx(L.theory) + '</div>';
  main.append(d);
  const seen = new Set();
  L.items.forEach(k => { const host = h('div'); main.append(host); placeTask(k, host, L.id, seen); });
  const more = h('div', 'more');
  const b = h('button', 'btn pri', '➕ Noch eine Aufgabe dieser Lektion'); b.type = 'button';
  b.onclick = () => { const host = h('div'); main.insertBefore(host, more); placeTask(pick(L.more), host, L.id, seen); host.scrollIntoView({behavior:'smooth', block:'start'}); };
  const nx = LESSONS[LESSONS.indexOf(L) + 1];
  more.append(b);
  if(nx){ const n = h('a', 'btn', 'Weiter: ' + nx.title + ' →'); n.href = '#' + nx.id; n.style.textDecoration = 'none'; more.append(n); }
  main.append(more);
}

function renderStart(){
  main.innerHTML = '';
  const c = h('div', 'card');
  c.innerHTML = `<h1 class="lt">🏁 Willkommen – Physik-Test üben</h1>
<p class="sub">Thema: <b>Mechanische Schwingungen – Fadenpendel &amp; Federpendel</b>. Der Stoff stammt aus eurem Nextcloud-Collective „Physik › 1 Mechanik › 1.1 Mechanische Schwingungen“.</p>
<div class="grid2">
<div class="box"><b>So funktioniert’s</b><ul style="margin:6px 0 0 18px"><li>Links wählst du eine <b>Lektion</b> (1–11).</li><li>Bei Fehlern erscheint die <b>Schritt-für-Schritt-Erklärung</b>.</li><li>💡 <b>Tipp</b> gibt Hinweise, 👁 <b>Lösung anzeigen</b> verrät alles.</li><li>Rechts: <b>Taschenrechner</b> und <b>Notizen</b> (werden gespeichert).</li></ul></div>
<div class="box warn"><b>Antworten eingeben</b><ul style="margin:6px 0 0 18px"><li>Zahlen mit Komma oder Punkt. Rechnungen gehen auch: <code>2*pi*sqrt(0,5/9,81)</code>.</li><li>Formeln tippen, z. B. <code>a*sqrt(b/c)</code> – unter dem Feld siehst du sie schön gesetzt. <code>pi</code> / <code>π</code>, <code>sqrt</code> / <code>√</code>, <code>^</code> für Hoch.</li><li>Brüche gehen auch: <code>1/3</code>.</li></ul></div></div>
<div class="more"><a class="btn pri" href="#l1" style="text-decoration:none">Mit Lektion 1 starten →</a><a class="btn" href="#zufall" style="text-decoration:none">🎲 Zufalls-Aufgaben</a><a class="btn" href="#test" style="text-decoration:none">📝 Testsimulation</a></div>`;
  main.append(c);

  const t = totals();
  const cats = Object.entries(catProg).filter(([, p]) => p.n >= 3).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
  if(cats.length){
    const w = h('div', 'card');
    w.innerHTML = '<h2>📊 Deine Schwachstellen</h2><p class="sub">Nach Trefferquote sortiert – die schwächsten zuerst.</p><div class="stats">' +
      cats.slice(0, 4).map(([k, p]) => '<div class="stat"><b>' + Math.round(100 * p.c / p.n) + ' %</b>' + CATS[k] + '<br><a class="lnk" href="#' + CAT_LESSON[k] + '">→ üben</a></div>').join('') + '</div>';
    main.append(w);
  }
  const w2 = h('div', 'card');
  w2.innerHTML = `<h2>✅ Das musst du für den Test können</h2>
<ul>
<li>Definition <b>mechanische Schwingung</b>; Entstehung: <b>rücktreibende Kraft + Trägheit</b> <a class="lnk" href="#l1">(L1)</a></li>
<li>Kenngrößen $A$, $T$, $f$, $omega$ mit Einheiten; $f = 1/T$ <a class="lnk" href="#l2">(L2)</a></li>
<li>t-y-Diagramm: A, T, f ablesen; gedämpft erkennen <a class="lnk" href="#l3">(L3)</a></li>
<li>Proportionalitäten ($y ~ sqrt(x)$, $y ~ 1/x$ …), Quotienten-Test, Linearisieren <a class="lnk" href="#l4">(L4)</a></li>
<li><b>Fadenpendel</b> $T = 2*pi*sqrt(l/g)$: Faktoren im Kopf, Rechnen, Umstellen <a class="lnk" href="#l5">(L5)</a> <a class="lnk" href="#l6">(L6)</a></li>
<li><b>Federpendel</b> $T = 2*pi*sqrt(m/D)$: Faktoren im Kopf, Rechnen, Hooke <a class="lnk" href="#l7">(L7)</a> <a class="lnk" href="#l8">(L8)</a></li>
<li>Welche <b>Kräfte</b> wann wirken (Diagramme!), Energie in Ruhelage/Umkehrpunkt <a class="lnk" href="#l9">(L9)</a></li>
<li>Schwingungstypen: gedämpft, erzwungen, selbsterregt, Resonanz <a class="lnk" href="#l10">(L10)</a></li>
<li>Messen von Schwingungen, Foucaultsches Pendel <a class="lnk" href="#l11">(L11)</a></li></ul>
<div class="box">Hinweis: In deiner Nextcloud liegt unter <i>Schule › Physik › 2026-2027</i> aktuell nur „Elektro Strom“ (Ohmsches Gesetz, Schaltkreise). Das ist <b>nicht</b> Teil dieser Seite – der Schwingungsstoff steht im Collective „Physik“.</div>`;
  main.append(tx2(w2));

  const f = h('details', 'theory'); f.open = true;
  f.innerHTML = '<summary>🧾 Formelblatt</summary><div class="tb">' + tx(`
<div class="fbox">$f = 1/T$ <span>$T = 1/f$</span> <span>$omega = 2*pi*f = 2*pi/T$</span></div>
<div class="fbox"><b>Fadenpendel:</b> $T = 2*pi*sqrt(l/g)$ <span>$l = g*T^2/(4*pi^2)$</span> <span>$g = 4*pi^2*l/T^2$</span></div>
<div class="fbox"><b>Federpendel:</b> $T = 2*pi*sqrt(m/D)$ <span>$D = 4*pi^2*m/T^2$</span> <span>$m = D*T^2/(4*pi^2)$</span></div>
<div class="fbox"><b>Kraft &amp; Bewegung:</b> $F_r = -D*x$ <span>$m*a = -D*x$</span> <span>$x(t) = A*cos(omega*t + phi)$</span> <span>$F_d = -b*v$</span></div>
<div class="fbox"><b>Energie:</b> $E_kin = 1/2*m*v^2$ <span>$E_pot = 1/2*D*x^2$</span> <span>$E_kin + E_pot = konstant$</span></div>
<div class="fbox"><b>Foucault:</b> $T = 24 {h}/sin(phi)$ &nbsp; <b>Werte:</b> $g = 9,81 {m/s^2}$ (Erde), $1,62 {m/s^2}$ (Mond)</div>`) + '</div>';

}
function tx2(node){ node.innerHTML = tx(node.innerHTML); return node; }

/* ---------- Zufalls-Generator ---------- */
const CAT_ORDER = ['faktor', 'rechnen_faden', 'rechnen_feder', 'formel', 'diagramm', 'kraefte', 'konzept', 'einheiten', 'prop'];
function renderRandom(){
  main.innerHTML = '';
  const sel = new Set(S.get('rsel', CAT_ORDER));
  let count = 0, good = 0, total = 0;
  const c = h('div', 'card');
  c.innerHTML = '<h1 class="lt">🎲 Zufalls-Aufgaben</h1><p class="sub">Unendlich viele neue Aufgaben mit neuen Zahlen. Wähle die Themen, die du üben willst.</p>';
  const chips = h('div', 'chips');
  CAT_ORDER.forEach(k => {
    const b = h('button', sel.has(k) ? 'on' : '', CATS[k]); b.type = 'button';
    b.onclick = () => { if(sel.has(k)) sel.delete(k); else sel.add(k); b.classList.toggle('on'); S.set('rsel', [...sel]); };
    chips.append(b);
  });
  c.append(chips);
  const bar = h('div', 'more'); bar.style.margin = '0';
  const go = h('button', 'btn pri', '🎲 Neue Zufallsaufgabe'); go.type = 'button';
  const sc = h('span', 'mut', 'Bisher: 0 Aufgaben');
  bar.append(go, sc); c.append(bar); main.append(c);
  const host = h('div'); main.append(host);
  function next(){
    const cats = [...sel]; if(!cats.length){ host.innerHTML = '<div class="card">Wähle mindestens ein Thema aus.</div>'; return; }
    const key = pick(pick(cats.map(k => CAT_POOLS[k])));
    const t = makeTask(key);
    const node = renderTask(t, {regen: next, onDone: r => {
      count++; good += r.good; total += r.total; rec('zufall', t.cat, r.good, r.total);
      sc.textContent = 'Bisher: ' + count + ' Aufgaben · ' + Math.round(100 * good / total) + ' % richtig im ersten Versuch';
      const n = h('button', 'btn pri', 'Nächste Aufgabe ▶'); n.type = 'button'; n.onclick = next;
      node.querySelector('.tfoot').append(n);
    }});
    host.replaceChildren(node);
  }
  go.onclick = next; next();
}

/* ---------- Testsimulation ---------- */
const TEST_MIX = ['factor:faden', 'factor:feder', 'factor:', 'fadenAny', 'fadenAny', 'federAny', 'federAny', 'formula', 'formula', 'graph', 'mc:', 'mc:', 'mc:typ', 'pos', 'prop', 'units', 'diag:feder', 'diag:ty'];
function renderTest(){
  main.innerHTML = '';
  const c = h('div', 'card');
  c.innerHTML = `<h1 class="lt">📝 Testsimulation</h1><p class="sub">Wie im echten Test: keine Tipps, keine Lösung vorab. Jede Teilaufgabe wird einmal geprüft, danach siehst du die Erklärung. Am Ende gibt es die Auswertung.</p>`;
  const n = h('select', 'sel'); [8, 12, 16].forEach(x => n.append(new Option(x + ' Aufgaben', x, false, x === 12)));
  const start = h('button', 'btn pri', '▶ Test starten'); start.type = 'button'; start.style.marginLeft = '10px';
  c.append(n, start); main.append(c);
  const host = h('div'); main.append(host);
  start.onclick = () => {
    const keys = shuffle(TEST_MIX).slice(0, +n.value);
    let i = 0, good = 0, total = 0, t0 = Date.now(); const byCat = {};
    c.style.display = 'none';
    const timer = h('div', 'card'); main.insertBefore(timer, host);
    let clock = '0:00';
    const tick = setInterval(() => { if(!document.body.contains(timer)){ clearInterval(tick); return; } const s = Math.floor((Date.now() - t0) / 1000); clock = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); const tm = timer.querySelector('.tm'); if(tm) tm.textContent = clock; }, 1000);
    function show(){
      timer.innerHTML = '<b>Aufgabe ' + (i + 1) + ' von ' + keys.length + '</b> &nbsp; ⏱ <span class="tm">' + clock + '</span>';
      const t = makeTask(keys[i]);
      const node = renderTask(t, {strict: true, onDone: r => {
        good += r.good; total += r.total; (byCat[t.cat] = byCat[t.cat] || {c:0, n:0}); byCat[t.cat].c += r.good; byCat[t.cat].n += r.total;
        rec('test', t.cat, r.good, r.total);
        const b = h('button', 'btn pri', i + 1 < keys.length ? 'Weiter ▶' : 'Auswertung ▶'); b.type = 'button';
        b.onclick = () => { i++; if(i < keys.length) show(); else finish(); };
        node.querySelector('.tfoot').append(b);
      }});
      host.replaceChildren(node);
    }
    function finish(){
      clearInterval(tick); timer.remove();
      const p = Math.round(100 * good / total);
      const w = Object.entries(byCat).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n);
      host.innerHTML = '<div class="card"><h2>' + (p >= 85 ? '🏆 ' : p >= 60 ? '👍 ' : '💪 ') + 'Auswertung: ' + p + ' %</h2><p>' + good + ' von ' + total + ' Teilaufgaben richtig.</p><div class="stats">' +
        w.map(([k, v]) => '<div class="stat"><b>' + Math.round(100 * v.c / v.n) + ' %</b>' + CATS[k] + '<br><a class="lnk" href="#' + CAT_LESSON[k] + '">→ üben</a></div>').join('') +
        '</div><button class="btn pri" id="again">Nochmal</button></div>';
      document.getElementById('again').onclick = renderTest;
    }
    show();
  };
}

/* ===================== ROUTER ===================== */
function route(){
  const id = (location.hash || '#start').slice(1);
  currentId = id;
  const L = LESSONS.find(x => x.id === id);
  if(L){ renderLesson(L); loadNotes(id, L.title.replace(/^\d+ · /, '')); }
  else if(id === 'zufall'){ renderRandom(); loadNotes(id, 'Zufalls-Aufgaben'); }
  else if(id === 'test'){ renderTest(); loadNotes(id, 'Testsimulation'); }
  else { currentId = 'start'; renderStart(); loadNotes('start', 'Allgemein'); }
  updNav(); window.scrollTo({top: 0});
}
window.addEventListener('hashchange', route);
buildNav(); updGlobal(); route();
</script>

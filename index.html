<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Share</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --text: #c9d1d9;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .wrapper { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
        #search {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            width: 250px;
            outline: none;
        }
        #search:focus { border-color: var(--accent); }
        #file-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0;
            list-style: none;
            overflow: hidden;
        }
        .file-item { background: var(--panel); }
        .file-item a {
            display: flex;
            padding: 16px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
        }
        .file-item a:hover { background: #1f242c; }
        .status-msg { padding: 20px; text-align: center; color: #8b949e; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Quick Share Rep</h1>
        <input type="text" id="search" placeholder="Filter files..." onkeyup="filterFiles()">
    </header>
    <ul id="file-list">
        <li class="status-msg" id="status">Loading repository...</li>
    </ul>
</div>

<script>
    let allFiles = [];

    async function fetchFiles() {
        // Updated with your actual details
        const user = "simonlukas102030";
        const repo = "Quick-share";
        
        const list = document.getElementById('file-list');
        const status = document.getElementById('status');

        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
            if (!res.ok) throw new Error("API Limit or Private Repo");
            
            const data = await res.json();
            // Filter for HTML files and exclude index.html
            allFiles = data.filter(f => f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html');
            renderList(allFiles);
        } catch (e) {
            status.textContent = "Error: GitHub API access failed. Check if repo is public.";
        }
    }

    function renderList(files) {
        const list = document.getElementById('file-list');
        list.innerHTML = files.map(file => `
            <li class="file-item">
                <a href="${file.name}">${file.name}</a>
            </li>
        `).join('') || '<li class="status-msg">No HTML files found.</li>';
    }

    function filterFiles() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = allFiles.filter(f => f.name.toLowerCase().includes(query));
        renderList(filtered);
    }

    fetchFiles();
</script>

</body>
</html>

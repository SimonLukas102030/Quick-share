<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nexus</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent: #00f2ff;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(157, 0, 255, 0.15) 0px, transparent 50%);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #00f2ff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            padding: 0;
            list-style: none;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2);
        }

        .card a {
            display: block;
            padding: 30px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            text-transform: capitalize;
        }

        .card .icon {
            font-size: 0.8rem;
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            opacity: 0.6;
            font-size: 1.2rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>Project Nexus</h1>

    <ul id="file-list">
        <li class="loading">Initializing System...</li>
    </ul>

    <script>
        async function loadFiles() {
            const username = "YOUR_GITHUB_USERNAME";
            const repo = "YOUR_REPO_NAME";
            const listElement = document.getElementById('file-list');

            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                listElement.innerHTML = ''; 

                files.forEach(file => {
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        const li = document.createElement('li');
                        li.className = 'card';
                        
                        const displayName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                        
                        li.innerHTML = `
                            <a href="${file.name}">
                                <span class="icon">HTML Project</span>
                                ${displayName}
                            </a>
                        `;
                        listElement.appendChild(li);
                    }
                });

                if (listElement.children.length === 0) {
                    listElement.innerHTML = '<li class="loading">No modules detected.</li>';
                }
            } catch (error) {
                listElement.innerHTML = '<li class="loading" style="color: #ff4b4b;">Connection Failed: Repository search aborted.</li>';
            }
        }

        loadFiles();
    </script>
</body>
</html>

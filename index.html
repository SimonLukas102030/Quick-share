<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick Share Hub</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 40px; }
        .wrapper { max-width: 800px; margin: 0 auto; }
        .file-item { 
            background: #161b22; border: 1px solid #30363d; 
            margin-bottom: 8px; border-radius: 6px; list-style: none;
        }
        .file-item a { 
            display: block; padding: 15px; color: #58a6ff; 
            text-decoration: none; cursor: pointer;
        }
        .file-item a:hover { background: #1f242c; }
        .locked::after { content: " 🔒"; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Quick Share</h1>
        <ul id="file-list">Loading...</ul>
    </div>

    <script>
        let passwords = {};

        // Funktion zum Hashen des Inputs
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function init() {
            const user = "simonlukas102030";
            const repo = "Quick-share";

            try {
                // 1. Passwörter laden
                const pRes = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/passwords.json`);
                if(pRes.ok) passwords = await pRes.json();

                // 2. Dateien laden
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
                const files = await res.json();
                
                const list = document.getElementById('file-list');
                list.innerHTML = "";

                files.forEach(file => {
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        const li = document.createElement('li');
                        li.className = 'file-item';
                        
                        const isLocked = passwords[file.name] ? 'locked' : '';
                        const a = document.createElement('a');
                        a.textContent = file.name;
                        a.className = isLocked;
                        
                        a.onclick = async () => {
                            if (passwords[file.name]) {
                                const pw = prompt("Dieses Projekt ist geschützt. Passwort:");
                                const hashedInput = await sha256(pw);
                                if (hashedInput === passwords[file.name]) {
                                    window.location.href = file.name;
                                } else {
                                    alert("Falsches Passwort!");
                                }
                            } else {
                                window.location.href = file.name;
                            }
                        };

                        li.appendChild(a);
                        list.appendChild(li);
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>

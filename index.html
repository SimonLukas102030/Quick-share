<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Share Hub</title>

    <!-- Browser Tab & General Favicon -->
    <link rel="icon" type="image/x-icon" href="Assets/Ico/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/Ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/Ico/favicon-16x16.png">
    
    <!-- Apple iOS / iPadOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/Ico/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Android / Chrome / Windows Tiles -->
    <link rel="icon" type="image/png" sizes="192x192" href="Assets/Ico/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="Assets/Ico/icon-512x512.png">

    <style>
        :root {
            --bg: #0a0f18;
            --bg-deep: #060a11;
            --panel: #111827;
            --panel-2: #151d2e;
            --panel-hover: #1a2438;
            --border: #263249;
            --border-soft: rgba(124, 156, 255, .12);
            --accent: #7aa2f7;
            --accent-2: #bb9af7;
            --cyan: #7dcfff;
            --green: #9ece6a;
            --yellow: #e0af68;
            --red: #f7768e;
            --text: #c0caf5;
            --text-bright: #d5dcf8;
            --muted: #7983a5;
            --shadow: 0 30px 80px rgba(0, 0, 0, .45);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            padding: 28px 20px 98px;
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular",
                         Consolas, "Liberation Mono", monospace;
            background:
                radial-gradient(circle at 8% 8%, rgba(122, 162, 247, .09), transparent 24%),
                radial-gradient(circle at 92% 12%, rgba(187, 154, 247, .07), transparent 22%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 55%, #0b111d 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 80%);
        }

        .wrapper {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 14px;
        }

        .title-wrap h1 {
            margin: 0;
            color: var(--text-bright);
            font-size: clamp(1.7rem, 4vw, 2.55rem);
            font-weight: 750;
            letter-spacing: -0.07em;
            text-shadow: 0 0 28px rgba(122, 162, 247, .14);
        }

        .title-wrap h1::before {
            content: "╭─ ";
            color: var(--accent);
            font-weight: 400;
        }

        .title-wrap p {
            margin: 5px 0 0 30px;
            color: var(--muted);
            font-size: .82rem;
        }

        .title-wrap p::before {
            content: "root@omarchy:~$ ";
            color: var(--green);
        }


        .repo-switcher { position: relative; }
        .repo-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(17, 24, 39, .92);
            color: var(--muted);
            font: inherit;
            font-size: .72rem;
            cursor: pointer;
        }
        .repo-pill:hover, .repo-pill[aria-expanded="true"] {
            border-color: rgba(122,162,247,.3);
            color: var(--text-bright);
            background: #151f31;
        }
        .repo-dot { color: var(--green); text-shadow: 0 0 10px rgba(158,206,106,.65); }
        .repo-chevron { color: var(--muted); font-size: .65rem; }
        .repo-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 200;
            width: min(380px, calc(100vw - 24px));
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0d1523;
            box-shadow: 0 25px 80px rgba(0,0,0,.55), 0 0 40px rgba(122,162,247,.06);
        }
        .repo-menu-title { padding: 8px 9px 7px; color: var(--muted); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; }
        .repo-option, .repo-add {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            text-align: left;
            font: inherit;
            cursor: pointer;
        }
        .repo-option:hover, .repo-option.active, .repo-add:hover { border-color: rgba(122,162,247,.15); background: #151f31; }
        .repo-option-dot { width: 16px; flex: 0 0 16px; color: var(--accent); }
        .repo-option strong { display: block; color: var(--text-bright); font-size: .72rem; }
        .repo-option small { display: block; margin-top: 2px; max-width: 305px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: .63rem; }
        .repo-divider { height: 1px; margin: 6px 0; background: var(--border); }
        .repo-add { color: var(--cyan); font-size: .7rem; }
        .repo-empty { padding: 8px 9px; color: var(--muted); font-size: .66rem; }
        .repo-help { margin: 8px 0 2px; padding: 10px; border: 1px solid rgba(122,162,247,.10); border-radius: 6px; background: rgba(122,162,247,.035); color: var(--muted); font-size: .64rem; line-height: 1.55; }
        .repo-help strong { display: block; margin-bottom: 4px; color: var(--text); }
        .repo-help code { color: var(--accent); }
        .file-actions { display: inline-flex; gap: 4px; margin-left: 6px; }
        .download-btn, .share-btn {
            width: 30px; height: 30px; flex: 0 0 30px;
            display: grid; place-items: center; padding: 0;
            border: 1px solid transparent; border-radius: 5px;
            background: transparent; color: var(--muted); cursor: pointer;
            font: inherit; font-size: .9rem; opacity: .72;
        }
        .download-btn:hover { opacity: 1; color: var(--accent); background: rgba(122,162,247,.08); border-color: rgba(122,162,247,.16); }
        .share-btn:hover { opacity: 1; color: var(--cyan); background: rgba(125,207,255,.08); border-color: rgba(125,207,255,.16); }
        .download-btn.copied, .share-btn.copied { color: var(--green); background: rgba(158,206,106,.08); border-color: rgba(158,206,106,.16); }

        .repo-pill {
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(17, 24, 39, .82);
            color: var(--muted);
            font-size: .72rem;
            box-shadow: inset 0 1px rgba(255,255,255,.025);
        }

        .repo-pill::before {
            content: "●";
            margin-right: 7px;
            color: var(--green);
            text-shadow: 0 0 10px rgba(158,206,106,.65);
        }

        .browser {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: rgba(13, 19, 31, .94);
            box-shadow:
                var(--shadow),
                0 0 0 1px rgba(122,162,247,.02),
                0 0 70px rgba(122,162,247,.055);
        }

        .browser-head {
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #121a2a, #0f1726);
        }

        .traffic {
            display: flex;
            gap: 7px;
            padding-right: 2px;
        }

        .traffic span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,.07);
        }

        .traffic span:nth-child(1) { background: var(--red); }
        .traffic span:nth-child(2) { background: var(--yellow); }
        .traffic span:nth-child(3) { background: var(--green); }

        .path-label {
            min-width: 0;
            color: var(--cyan);
            font-size: .78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .path-label::before {
            content: "~/Quick-share";
            color: var(--muted);
            margin-right: 8px;
        }

        #file-list {
            margin: 0;
            padding: 10px;
            list-style: none;
        }

        .tree-item { margin: 1px 0; }

        .tree-row {
            min-height: 43px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            transition:
                background .12s ease,
                border-color .12s ease,
                transform .08s ease;
        }

        .tree-row:hover {
            background: var(--panel-hover);
            border-color: var(--border-soft);
        }

        .tree-row:hover .name {
            color: var(--text-bright);
            text-shadow: 0 0 12px rgba(122,162,247,.12);
        }

        .tree-row:active { transform: translateX(1px); }

        .tree-row.folder .name {
            color: #c9d7ff;
            font-weight: 700;
        }

        .caret {
            width: 14px;
            flex: 0 0 14px;
            color: var(--muted);
            text-align: center;
            font-size: .8rem;
            transition: transform .13s ease;
        }

        .folder.open > .tree-row .caret {
            transform: rotate(90deg);
            color: var(--accent);
        }

        .icon {
            width: 20px;
            flex: 0 0 20px;
            display: grid;
            place-items: center;
            filter: saturate(.85);
            font-size: .98rem;
        }

        .name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta {
            color: var(--muted);
            font-size: .70rem;
            white-space: nowrap;
            opacity: .8;
        }

        .share-btn {
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: .9rem;
            opacity: .7;
            transition: background .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
        }

        .share-btn:hover {
            opacity: 1;
            color: var(--cyan);
            background: rgba(125, 207, 255, .08);
            border-color: rgba(125, 207, 255, .16);
            text-shadow: 0 0 12px rgba(125, 207, 255, .3);
        }

        .share-btn.copied {
            color: var(--green);
            background: rgba(158, 206, 106, .08);
            border-color: rgba(158, 206, 106, .16);
        }

        .locked-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 7px;
            border-radius: 4px;
            border: 1px solid rgba(187,154,247,.18);
            background: rgba(187,154,247,.08);
            color: var(--accent-2);
            font-size: .64rem;
            font-weight: 700;
        }

        .children {
            display: none;
            margin-left: 18px;
            padding-left: 11px;
            border-left: 1px solid #2b3852;
        }

        .folder.open > .children {
            display: block;
            animation: reveal .13s ease-out;
        }

        .children > .tree-item > .tree-row::before {
            content: "├─";
            color: #3c4b67;
            margin-right: 1px;
            font-size: .68rem;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status {
            padding: 28px 18px;
            color: var(--muted);
            text-align: center;
            font-size: .8rem;
        }

        .status::before {
            content: "[ ";
            color: var(--accent);
        }

        .status::after {
            content: " ]";
            color: var(--accent);
        }

        .status.error {
            color: var(--red);
        }

        #debug-bar {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 15px;
            z-index: 100;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
            padding: 8px 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(7, 11, 18, .95);
            box-shadow: 0 14px 45px rgba(0,0,0,.42);
            color: var(--muted);
            font-size: .68rem;
        }

        .debug-item {
            min-width: 0;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .debug-item::before {
            color: var(--accent);
            content: ">";
        }

        .debug-val {
            min-width: 0;
            color: #9eb8ff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: inherit;
        }


        .viewer-shell {
            min-height: 70vh;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: rgba(13,19,31,.96);
            box-shadow: var(--shadow), 0 0 70px rgba(122,162,247,.05);
        }

        .viewer-head {
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #121a2a, #0f1726);
        }

        .back-btn {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #111827;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: .72rem;
        }

        .back-btn:hover {
            border-color: rgba(122,162,247,.3);
            color: var(--accent);
        }

        .viewer-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-bright);
            font-size: .8rem;
        }

        .code-viewer {
            min-height: 65vh;
            margin: 0;
            padding: 22px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            background: #0a0f18;
            color: #bcc8ea;
            font: .82rem/1.65 "JetBrains Mono", "Cascadia Code", monospace;
        }

        .markdown-viewer {
            max-width: 920px;
            margin: 0 auto;
            padding: 30px;
            color: #c0caf5;
            line-height: 1.75;
            overflow-wrap: anywhere;
        }

        .markdown-viewer h1,
        .markdown-viewer h2,
        .markdown-viewer h3 {
            color: #d5dcf8;
            letter-spacing: -.035em;
        }

        .markdown-viewer h1 {
            padding-bottom: .35em;
            border-bottom: 1px solid var(--border);
        }

        .markdown-viewer a { color: var(--cyan); }
        .markdown-viewer code {
            padding: .13em .35em;
            border-radius: 4px;
            background: #151d2e;
            color: var(--accent-2);
        }

        .markdown-viewer pre {
            padding: 16px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: #0a0f18;
        }

        .markdown-viewer blockquote {
            margin-left: 0;
            padding-left: 15px;
            border-left: 3px solid var(--accent);
            color: var(--muted);
        }

        .markdown-viewer img { max-width: 100%; height: auto; }

        .markdown-viewer table {
            width: 100%;
            border-collapse: collapse;
        }

        .markdown-viewer th,
        .markdown-viewer td {
            padding: 8px 10px;
            border: 1px solid var(--border);
        }

        @media (max-width: 680px) {
            body { padding: 20px 12px 92px; }
            .hero { align-items: flex-start; }
            .repo-pill { display: none; }
            .meta { display: none; }
            #debug-bar {
                left: 10px;
                right: 10px;
                bottom: 9px;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="hero">
            <div class="title-wrap">
                <h1>Quick Share Hub</h1>
                <p>Dateien und Ordner aus dem Repository</p>
            </div>
            <div class="repo-switcher">
                <button class="repo-pill" id="repo-pill" type="button" aria-haspopup="menu" aria-expanded="false">
                    <span class="repo-dot">●</span>
                    <span id="repo-pill-label">GitHub Repository</span>
                    <span class="repo-chevron">▾</span>
                </button>
                <div class="repo-menu" id="repo-menu" role="menu" hidden>
                    <div class="repo-menu-title">Repository auswählen</div>
                    <button class="repo-option active" id="repo-main-option" type="button">
                        <span class="repo-option-dot">●</span>
                        <span><strong>Quick Share Hub</strong><small>Dein Standard-Repository</small></span>
                    </button>
                    <div class="repo-divider"></div>
                    <div id="custom-repo-list"></div>
                    <button class="repo-add" id="repo-add" type="button">＋ Eigenes GitHub Pages Repository</button>
                    <div class="repo-help">
                        <strong>Wo finde ich den Link?</strong>
                        <span>GitHub → <code>Settings → Pages → Visit site</code><br>
                        Beispiel: <code>https://name.github.io/repository/</code></span>
                    </div>
                </div>
            </div>
        </div>

        <section class="browser" aria-label="Datei-Browser">
            <div class="browser-head">
                <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="path-label" id="path-label">/</div>
            </div>
            <ul id="file-list">
                <li class="status">Initialisiere...</li>
            </ul>
        </section>
    </div>

    <div id="debug-bar">
        <div class="debug-item"><span>Eingabe:</span><span id="last-input" class="debug-val">-</span></div>
        <div class="debug-item"><span>SHA-256:</span><span id="generated-hash" class="debug-val">-</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <script>
        const DEFAULT_REPO = {
            id: "default",
            label: "Quick Share Hub",
            pages: "https://simonlukas102030.github.io/Quick-share/",
            api: "https://api.github.com/repos/simonlukas102030/Quick-share/contents",
            raw: "https://raw.githubusercontent.com/simonlukas102030/Quick-share/main",
            editable: false
        };

        const REPO_STORAGE_KEY = "quick-share-hub.repositories.v1";
        const ACTIVE_REPO_KEY = "quick-share-hub.activeRepository.v1";

        let passwords = {};
        let activeRepo = DEFAULT_REPO;

        function normalisePagesUrl(value) {
            let url = String(value || "").trim();
            if (!url) return "";
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;
            if (!url.endsWith("/")) url += "/";
            return url;
        }

        function repoFromPagesUrl(pagesUrl, label = "") {
            const pages = normalisePagesUrl(pagesUrl);
            try {
                const parsed = new URL(pages);
                const match = parsed.hostname.match(/^([^.]+)\.github\.io$/i);
                if (!match) return null;

                const user = match[1];
                const segments = parsed.pathname.split("/").filter(Boolean);
                const repoName = segments[0] || `${user}.github.io`;

                return {
                    id: (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`),
                    label: label || `${user}/${repoName}`,
                    pages,
                    api: `https://api.github.com/repos/${user}/${repoName}/contents`,
                    raw: `https://raw.githubusercontent.com/${user}/${repoName}/main`,
                    editable: true,
                    user,
                    repo: repoName
                };
            } catch {
                return null;
            }
        }

        function getCustomRepositories() {
            try {
                const repos = JSON.parse(localStorage.getItem(REPO_STORAGE_KEY) || "[]");
                return Array.isArray(repos) ? repos : [];
            } catch {
                return [];
            }
        }

        function saveCustomRepositories(repos) {
            localStorage.setItem(REPO_STORAGE_KEY, JSON.stringify(repos));
        }

        function saveActiveRepository(repo) {
            localStorage.setItem(ACTIVE_REPO_KEY, JSON.stringify({ id: repo.id, pages: repo.pages }));
        }

        function loadActiveRepository() {
            try {
                const saved = JSON.parse(localStorage.getItem(ACTIVE_REPO_KEY) || "null");
                if (!saved) return DEFAULT_REPO;
                if (saved.id === DEFAULT_REPO.id || saved.pages === DEFAULT_REPO.pages) return DEFAULT_REPO;
                return getCustomRepositories().find(repo => repo.id === saved.id || repo.pages === saved.pages) || DEFAULT_REPO;
            } catch {
                return DEFAULT_REPO;
            }
        }

        function isDefaultRepository() {
            return activeRepo.id === DEFAULT_REPO.id;
        }

        function getApiRoot() {
            return activeRepo.api;
        }

        function getRawRoot() {
            return activeRepo.raw;
        }

        function getPagesRoot() {
            return activeRepo.pages;
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").toLowerCase();
        }

        function getIcon(file) {
            if (file.type === "dir") return "📁";

            const ext = (file.name.split(".").pop() || "").toLowerCase();
            const icons = {
                html: "🌐", htm: "🌐",
                css: "🎨", scss: "🎨",
                js: "🟨", mjs: "🟨", cjs: "🟨",
                ts: "🔷", jsx: "⚛️", tsx: "⚛️",
                json: "🧩", xml: "🗂️", yaml: "📝", yml: "📝",
                md: "📘", txt: "📄", csv: "📊",
                pdf: "📕", doc: "📘", docx: "📘",
                xls: "📗", xlsx: "📗",
                ppt: "📙", pptx: "📙",
                zip: "🗜️", rar: "🗜️", "7z": "🗜️",
                exe: "⚙️", msi: "⚙️", bat: "⌨️", cmd: "⌨️",
                ps1: "🔷", sh: "🐚",
                png: "🖼️", jpg: "🖼️", jpeg: "🖼️", gif: "🖼️", webp: "🖼️", svg: "🖼️",
                mp3: "🎵", wav: "🎵", flac: "🎵",
                mp4: "🎬", mkv: "🎬", mov: "🎬", avi: "🎬",
                iso: "💿"
            };
            return icons[ext] || "📄";
        }

        function formatSize(bytes) {
            if (!Number.isFinite(bytes)) return "";
            const units = ["B", "KB", "MB", "GB"];
            let value = bytes;
            let unit = 0;
            while (value >= 1024 && unit < units.length - 1) {
                value /= 1024;
                unit++;
            }
            return `${value < 10 && unit > 0 ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
        }

        function isHiddenFile(file) {
            if (!isDefaultRepository()) return false;
            const name = file.name.toLowerCase();
            return name === "passwords.json" || name === "index.html";
        }

        function passwordHashFor(path, fileName) {
            // Unterstützt sowohl "ordner/datei.ext" als auch "datei.ext".
            return passwords[path] ?? passwords[fileName];
        }


        async function downloadFile(file, fullPath, button) {
            const rawUrl = file.download_url ||
                `${getRawRoot()}/${fullPath.split("/").map(encodeURIComponent).join("/")}`;

            try {
                const response = await fetch(rawUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = file.name;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                button.classList.add("copied");
                button.textContent = "✓";
                setTimeout(() => {
                    button.classList.remove("copied");
                    button.textContent = "↓";
                }, 1200);
            } catch (error) {
                window.location.href = rawUrl;
            }
        }

        async function shareFile(file, fullPath, button) {
            const ext = getExtension(file.name);
            let link;

            if (WEB_PAGE_EXTENSIONS.has(ext)) {
                link = getGitHubPagesUrl(fullPath);
            } else if (ext === "md" || ext === "markdown") {
                link = makeViewerUrl("markdown", fullPath, file.name);
            } else if (VIEWER_EXTENSIONS.has(ext)) {
                link = makeViewerUrl("text", fullPath, file.name);
            } else {
                link = file.download_url ||
                    `${getRawRoot()}/${fullPath.split("/").map(encodeURIComponent).join("/")}`;
            }

            const message = `Open ${file.name} via Quick Share Hub using the following link: ${link}`;

            try {
                await navigator.clipboard.writeText(message);
            } catch (error) {
                // Fallback for browsers/contexts where Clipboard API is unavailable.
                const textarea = document.createElement("textarea");
                textarea.value = message;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }

            const oldText = button.textContent;
            button.textContent = "✓";
            button.classList.add("copied");
            button.title = "Share message copied";

            setTimeout(() => {
                button.textContent = oldText;
                button.classList.remove("copied");
                button.title = "Share";
            }, 1400);
        }

        function makeFileRow(file, fullPath) {
            const li = document.createElement("li");
            li.className = "tree-item";

            const row = document.createElement("div");
            row.className = "tree-row";
            row.dataset.path = fullPath;

            const caret = document.createElement("span");
            caret.className = "caret";
            caret.textContent = "›";

            const icon = document.createElement("span");
            icon.className = "icon";
            icon.textContent = getIcon(file);

            const name = document.createElement("span");
            name.className = "name";
            name.textContent = file.name;

            const passwordHash = passwordHashFor(fullPath, file.name);
            const meta = document.createElement("span");
            meta.className = "meta";

            if (file.type !== "dir" && file.size != null) {
                meta.textContent = formatSize(file.size);
            }

            row.append(caret, icon, name);

            if (passwordHash) {
                const badge = document.createElement("span");
                badge.className = "locked-badge";
                badge.textContent = "🔒 geschützt";
                row.appendChild(badge);
            }

            // Share button: copies a ready-to-paste Quick Share Hub message.
            if (file.type !== "dir") {
                const actions = document.createElement("span");
                actions.className = "file-actions";

                const downloadButton = document.createElement("button");
                downloadButton.type = "button";
                downloadButton.className = "download-btn";
                downloadButton.textContent = "↓";
                downloadButton.title = "Download";
                downloadButton.setAttribute("aria-label", `Download ${file.name}`);
                downloadButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    downloadFile(file, fullPath, downloadButton);
                });

                const shareButton = document.createElement("button");
                shareButton.type = "button";
                shareButton.className = "share-btn";
                shareButton.textContent = "⤴";
                shareButton.title = "Share";
                shareButton.setAttribute("aria-label", `Share ${file.name}`);
                shareButton.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    shareFile(file, fullPath, shareButton);
                });

                actions.append(downloadButton, shareButton);
                row.appendChild(actions);
            }

            row.appendChild(meta);
            li.appendChild(row);

            if (file.type === "dir") {
                li.classList.add("folder");

                const children = document.createElement("div");
                children.className = "children";
                children.innerHTML = `<div class="status">Lade Ordner...</div>`;
                li.appendChild(children);

                let loaded = false;
                row.addEventListener("click", async () => {
                    li.classList.toggle("open");

                    if (li.classList.contains("open")) {
                        document.getElementById("path-label").textContent = "/" + fullPath + "/";
                    }

                    if (loaded) return;

                    try {
                        const items = await fetchContents(fullPath);
                        children.innerHTML = "";
                        renderItems(items, children, fullPath);
                        loaded = true;
                    } catch (error) {
                        children.innerHTML = `<div class="status error">Ordner konnte nicht geladen werden.</div>`;
                        console.error(error);
                    }
                });
            } else {
                row.addEventListener("click", () => openFile(file, fullPath, passwordHash));
            }

            return li;
        }

        function renderItems(items, container, parentPath = "") {
            if (!items.length) {
                container.innerHTML = '<div class="status">Dieser Ordner ist leer.</div>';
                return;
            }

            const sorted = [...items]
                .filter(file => !isHiddenFile(file))
                .sort((a, b) => {
                    if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
                    return a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true });
                });

            for (const file of sorted) {
                const fullPath = parentPath ? `${parentPath}/${file.name}` : file.name;
                container.appendChild(makeFileRow(file, fullPath));
            }
        }

        async function fetchContents(path = "") {
            const url = `${getApiRoot()}${path ? "/" + path : ""}`;
            const response = await fetch(`${url}?t=${Date.now()}`);
            if (!response.ok) throw new Error(`GitHub API: ${response.status}`);
            const data = await response.json();
            return Array.isArray(data) ? data : [data];
        }

        function getGitHubPagesUrl(fullPath) {
            const encodedPath = fullPath.split("/").map(encodeURIComponent).join("/");
            return `${getPagesRoot()}${encodedPath}`;
        }

        function getExtension(fileName) {
            const clean = fileName.split("?")[0].split("#")[0];
            const dot = clean.lastIndexOf(".");
            return dot >= 0 ? clean.slice(dot + 1).toLowerCase() : "";
        }

        const WEB_PAGE_EXTENSIONS = new Set(["html", "htm", "xhtml"]);

        const VIEWER_EXTENSIONS = new Set([
            "txt", "log", "json", "xml", "csv", "css",
            "js", "mjs", "cjs", "ts", "tsx", "jsx",
            "py", "java", "c", "h", "cpp", "hpp", "cs", "go",
            "rs", "php", "rb", "sh", "bash", "zsh", "fish",
            "ps1", "bat", "cmd", "sql", "yaml", "yml", "toml",
            "ini", "conf", "env"
        ]);

        const DOWNLOAD_EXTENSIONS = new Set([
            "zip", "rar", "7z", "tar", "gz", "bz2", "xz",
            "exe", "msi", "deb", "rpm", "appimage", "dmg", "iso",
            "doc", "docx", "xls", "xlsx", "ppt", "pptx",
            "odt", "ods", "odp", "apk", "jar", "bin", "dll",
            "so", "dylib"
        ]);

        const IMAGE_EXTENSIONS = new Set([
            "png", "jpg", "jpeg", "gif", "webp", "svg", "bmp", "ico", "avif"
        ]);

        const MEDIA_EXTENSIONS = new Set([
            "mp3", "wav", "ogg", "oga", "m4a", "aac", "flac",
            "mp4", "webm", "ogv", "mov", "m4v"
        ]);

        function makeViewerUrl(mode, fullPath, title) {
            const viewerUrl = new URL(window.location.href);
            viewerUrl.search = "";
            viewerUrl.hash = "";
            viewerUrl.searchParams.set("view", mode);
            viewerUrl.searchParams.set("path", fullPath);
            viewerUrl.searchParams.set("title", title);
            return viewerUrl.href;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function renderViewerMode() {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get("view");
            const requestedPath = params.get("path");

            if (!mode || !requestedPath) return false;

            const wrapper = document.querySelector(".wrapper");
            const debugBar = document.getElementById("debug-bar");
            if (debugBar) debugBar.style.display = "none";

            const fileName = requestedPath.split("/").pop();
            const rawUrl = `${getRawRoot()}/${requestedPath.split("/").map(encodeURIComponent).join("/")}`;

            wrapper.innerHTML = `
                <div class="viewer-shell">
                    <div class="viewer-head">
                        <button class="back-btn" id="back-btn">← back</button>
                        <div class="viewer-title">${mode === "markdown" ? "📘" : "📄"} ${escapeHtml(fileName)}</div>
                    </div>
                    ${mode === "markdown"
                        ? '<article class="markdown-viewer" id="viewer-content"><div class="status">Lade Markdown...</div></article>'
                        : '<pre class="code-viewer" id="viewer-content"><span class="status">Lade Datei...</span></pre>'}
                </div>
            `;

            document.getElementById("back-btn").onclick = () => history.back();

            try {
                const response = await fetch(rawUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const source = await response.text();
                const content = document.getElementById("viewer-content");

                if (mode === "markdown") {
                    if (window.marked && window.DOMPurify) {
                        content.innerHTML = DOMPurify.sanitize(marked.parse(source));
                    } else {
                        content.textContent = source;
                    }
                } else {
                    content.textContent = source;
                }
            } catch (error) {
                document.getElementById("viewer-content").innerHTML =
                    '<div class="status error">Datei konnte nicht geladen werden.</div>';
                console.error(error);
            }

            return true;
        }

        async function openFile(file, fullPath, passwordHash) {
            const hashOutput = document.getElementById("generated-hash");
            const lastInputDisplay = document.getElementById("last-input");

            if (passwordHash) {
                const pw = prompt(`Passwort erforderlich für ${fullPath}:`);
                if (!pw) return;

                const hashedInput = await sha256(pw);
                lastInputDisplay.textContent = pw;
                hashOutput.textContent = hashedInput;

                if (hashedInput !== String(passwordHash).toLowerCase().trim()) {
                    alert("Falsches Passwort!");
                    return;
                }
            }

            const ext = getExtension(file.name);
            const rawUrl = file.download_url ||
                `${getRawRoot()}/${fullPath.split("/").map(encodeURIComponent).join("/")}`;

            // HTML is served by GitHub Pages as a real web page.
            if (WEB_PAGE_EXTENSIONS.has(ext)) {
                window.location.href = getGitHubPagesUrl(fullPath);
                return;
            }

            // Markdown is rendered by this Quick Share Hub viewer.
            if (ext === "md" || ext === "markdown") {
                window.location.href = makeViewerUrl("markdown", fullPath, file.name);
                return;
            }

            // Source/config/text files are rendered in a readable code viewer.
            if (VIEWER_EXTENSIONS.has(ext)) {
                window.location.href = makeViewerUrl("text", fullPath, file.name);
                return;
            }

            // PDF, images, audio and video can be handled by the browser itself.
            if (ext === "pdf" || IMAGE_EXTENSIONS.has(ext) || MEDIA_EXTENSIONS.has(ext)) {
                window.location.href = rawUrl;
                return;
            }

            // Other binary formats: use GitHub's raw file URL, letting the browser
            // download/open it according to the file type and OS.
            if (DOWNLOAD_EXTENSIONS.has(ext)) {
                window.location.href = rawUrl;
                return;
            }

            // Best-effort fallback for unknown file types.
            window.location.href = rawUrl;
        }


        function updateRepositoryButton() {
            const label = document.getElementById("repo-pill-label");
            if (label) label.textContent = isDefaultRepository() ? "GitHub Repository" : activeRepo.label;
        }

        function renderRepositoryMenu() {
            const list = document.getElementById("custom-repo-list");
            if (!list) return;
            list.innerHTML = "";

            const repos = getCustomRepositories();
            for (const repo of repos) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "repo-option" + (activeRepo.id === repo.id ? " active" : "");
                button.innerHTML = `
                    <span class="repo-option-dot">${activeRepo.id === repo.id ? "●" : "○"}</span>
                    <span>
                        <strong>${escapeHtml(repo.label)}</strong>
                        <small>${escapeHtml(repo.pages)}</small>
                    </span>`;
                button.addEventListener("click", () => selectRepository(repo));
                list.appendChild(button);
            }

            if (!repos.length) {
                const empty = document.createElement("div");
                empty.className = "repo-empty";
                empty.textContent = "Noch kein eigenes Repository gespeichert.";
                list.appendChild(empty);
            }

            const main = document.getElementById("repo-main-option");
            if (main) {
                main.classList.toggle("active", isDefaultRepository());
                main.querySelector(".repo-option-dot").textContent = isDefaultRepository() ? "●" : "○";
            }
        }

        async function selectRepository(repo) {
            activeRepo = repo;
            saveActiveRepository(repo);
            updateRepositoryButton();
            renderRepositoryMenu();

            const menu = document.getElementById("repo-menu");
            const pill = document.getElementById("repo-pill");
            if (menu) menu.hidden = true;
            if (pill) pill.setAttribute("aria-expanded", "false");

            window.history.replaceState({}, "", window.location.pathname);
            document.getElementById("path-label").textContent = "/";
            await init();
        }

        function openRepositoryDialog() {
            const pagesInput = prompt(
                "GitHub Pages URL deines Repositories:\\n\\n" +
                "Beispiel:\\nhttps://DEINNAME.github.io/MEIN-REPO/\\n\\n" +
                "Du findest sie in GitHub unter:\\nSettings → Pages → Visit site",
                ""
            );

            if (pagesInput === null) return;

            const pages = normalisePagesUrl(pagesInput);
            const parsed = repoFromPagesUrl(pages);

            if (!parsed) {
                alert("Bitte eine GitHub-Pages-URL wie https://name.github.io/repository/ eingeben.");
                return;
            }

            const label = prompt("Name für dieses Repository:", parsed.label);
            if (label === null) return;
            parsed.label = label.trim() || parsed.label;

            const repos = getCustomRepositories();
            const existingIndex = repos.findIndex(repo => repo.pages === parsed.pages);

            if (existingIndex >= 0) {
                parsed.id = repos[existingIndex].id;
                repos[existingIndex] = parsed;
            } else {
                repos.push(parsed);
            }

            saveCustomRepositories(repos);
            selectRepository(parsed);
        }

        function setupRepositorySwitcher() {
            activeRepo = loadActiveRepository();
            updateRepositoryButton();
            renderRepositoryMenu();

            const pill = document.getElementById("repo-pill");
            const menu = document.getElementById("repo-menu");
            const add = document.getElementById("repo-add");
            const main = document.getElementById("repo-main-option");

            pill.addEventListener("click", (event) => {
                event.stopPropagation();
                menu.hidden = !menu.hidden;
                pill.setAttribute("aria-expanded", String(!menu.hidden));
                renderRepositoryMenu();
            });

            add.addEventListener("click", (event) => {
                event.stopPropagation();
                openRepositoryDialog();
            });

            main.addEventListener("click", () => selectRepository(DEFAULT_REPO));

            document.addEventListener("click", (event) => {
                if (!event.target.closest(".repo-switcher")) {
                    menu.hidden = true;
                    pill.setAttribute("aria-expanded", "false");
                }
            });
        }

        async function init() {
            const list = document.getElementById("file-list");

            try {
                passwords = {};
                if (isDefaultRepository()) {
                    const pRes = await fetch(`${getRawRoot()}/passwords.json?t=${Date.now()}`);
                    if (pRes.ok) passwords = await pRes.json();
                }

                const files = await fetchContents("");
                list.innerHTML = "";
                renderItems(files, list);
                document.getElementById("path-label").textContent = "/";
            } catch (e) {
                console.error(e);
                list.innerHTML = '<li class="status error">Fehler beim Laden der Dateien aus dem GitHub Repository.</li>';
            }
        }

        (async () => {
            setupRepositorySwitcher();
            if (!(await renderViewerMode())) {
                await init();
            }
        })();
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quick Share Hub</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --accent: #58a6ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px; margin: 0; }
        .wrapper { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        #file-list { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 6px; padding: 0; list-style: none; overflow: hidden; }
        .file-item { background: var(--panel); }
        .file-item a { display: block; padding: 16px; color: var(--accent); text-decoration: none; cursor: pointer; transition: background 0.1s; }
        .file-item a:hover { background: #1f242c; }
        .locked::after { content: " 🔒"; opacity: 0.5; font-size: 0.9rem; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Quick Share Rep</h1>
        <ul id="file-list"><li style="padding:20px">Loading System...</li></ul>
    </div>

    <script>
        let passwords = {};

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toLowerCase();
        }

        async function init() {
            const user = "simonlukas102030";
            const repo = "Quick-share";
            const list = document.getElementById('file-list');

            try {
                // Cache-Busting: Wir hängen einen Zeitstempel an, damit GitHub nicht die alte Datei schickt
                const pRes = await fetch(`https://raw.githubusercontent.com/${user}/${repo}/main/passwords.json?t=${Date.now()}`);
                if(pRes.ok) passwords = await pRes.json();

                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
                const files = await res.json();
                
                list.innerHTML = "";
                files.forEach(file => {
                    if (file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html') {
                        const li = document.createElement('li');
                        li.className = 'file-item';
                        const isLocked = passwords[file.name];
                        
                        const a = document.createElement('a');
                        a.textContent = file.name;
                        if(isLocked) a.classList.add('locked');
                        
                        a.onclick = async () => {
                            if (isLocked) {
                                const pw = prompt("Passwort erforderlich:");
                                if (!pw) return;
                                const hashedInput = await sha256(pw);
                                
                                // Debug Info für dich in der F12 Konsole
                                console.log("Eingegebenes PW:", pw);
                                console.log("Generierter Hash:", hashedInput);
                                console.log("Erwarteter Hash aus JSON:", passwords[file.name]);

                                if (hashedInput === passwords[file.name].toLowerCase().trim()) {
                                    window.location.href = file.name;
                                } else {
                                    alert("Falsch! Check die Konsole (F12) für den richtigen Hash.");
                                }
                            } else {
                                window.location.href = file.name;
                            }
                        };
                        li.appendChild(a);
                        list.appendChild(li);
                    }
                });
            } catch (e) {
                list.innerHTML = "<li>Fehler beim Laden. Repo öffentlich?</li>";
            }
        }
        init();
    </script>
</body>
</html>

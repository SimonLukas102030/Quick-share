<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1b26">
<title>simonsstudios · Dashboard</title>
<style>
  :root{
    --bg-deep:#1a1b26;
    --bg-panel:#1f2335;
    --bg-inset:#16161e;
    --bg-hover:#292e42;
    --border:#2d3149;
    --text-primary:#c0caf5;
    --text-muted:#8188b3;
    --text-dim:#565f89;
    --accent-blue:#7aa2f7;
    --accent-purple:#bb9af7;
    --accent-cyan:#7dcfff;
    --accent-green:#9ece6a;
    --accent-yellow:#e0af68;
    --accent-red:#f7768e;
    --shadow:0 18px 50px rgba(0,0,0,.22);
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg-deep)}
  body{
    color:var(--text-primary);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;display:flex;background:var(--bg-deep)}
  .sidebar{
    width:256px;flex:0 0 256px;display:flex;flex-direction:column;
    background:var(--bg-panel);border-right:1px solid var(--border)
  }
  .brand{padding:20px;border-bottom:1px solid var(--border)}
  .brand-name{font:600 15px/1 "JetBrains Mono",ui-monospace,monospace}
  .brand-sub{font-size:12px;color:var(--text-dim);margin-top:7px}
  .cursor{
    display:inline-block;width:8px;height:1em;margin-left:2px;
    background:var(--accent-green);vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite
  }
  @keyframes blink{50%{opacity:0}}
  .nav{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:3px}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
    border-radius:8px;border:1px solid transparent;background:transparent;
    color:var(--text-muted);font-size:13.5px;text-align:left
  }
  .nav-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
  .nav-btn.active{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border)}
  .nav-icon{width:17px;height:17px;flex:0 0 17px}
  .nav-label{flex:1}
  .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .view-switch{
    padding:16px 12px;border-top:1px solid var(--border)
  }
  .switch-title{
    font-size:11.5px;color:var(--text-dim);margin:0 0 8px 2px
  }
  .switches{display:flex;gap:8px}
  .group-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 6px;font-size:12.5px;border-radius:7px;border:1px solid var(--border);
    background:var(--bg-inset);color:var(--text-muted)
  }
  .group-btn.active{
    color:var(--bg-deep);background:var(--accent-cyan);border-color:var(--accent-cyan);font-weight:600
  }
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg-deep)
  }
  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-muted)}
  .crumb-current{color:var(--text-primary)}
  .theme-pill{
    padding:4px 10px;border-radius:999px;border:1px solid var(--border);
    color:var(--accent-purple);font:11.5px "JetBrains Mono",ui-monospace,monospace
  }
  .content{flex:1;overflow:auto;padding:32px}
  .page{max-width:900px}
  h1,h2,h3{margin:0}
  .hero h1{font-size:26px;font-weight:600;margin-bottom:6px}
  .hero p{color:var(--text-muted);font-size:14.5px;line-height:1.6;max-width:520px;margin:0}
  .action-btn{
    margin-top:20px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent-green);
    background:rgba(158,206,106,.1);color:var(--accent-green);font-size:13.5px;font-weight:600
  }
  .section-kicker{font-size:12.5px;color:var(--text-dim)}
  .module-list{
    margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden
  }
  .module-item{
    display:flex;align-items:center;gap:12px;padding:12px 14px;
    background:var(--bg-panel);border-bottom:1px solid var(--border)
  }
  .module-item:last-child{border-bottom:0}
  .module-name{flex:1;font-size:13.5px}
  .planned{font:11px "JetBrains Mono",ui-monospace,monospace;color:var(--accent-yellow)}
  .empty-state{max-width:440px;margin-top:60px}
  .empty-icon{
    width:44px;height:44px;display:grid;place-items:center;margin-bottom:16px;
    border-radius:10px;background:var(--bg-panel);border:1px solid var(--border)
  }
  .empty-state h2{font-size:18px;font-weight:600;margin-bottom:6px}
  .empty-state p{color:var(--text-muted);font-size:13.5px;line-height:1.6;margin:0}
  .link-btn{
    margin-top:14px;padding:0;border:0;background:transparent;color:var(--accent-green);font-size:12.5px
  }
  .settings{max-width:520px}
  .settings h1{font-size:20px;font-weight:600;margin-bottom:18px}
  .settings-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:26px}
  .settings-row{
    display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-panel);
    border-bottom:1px solid var(--border)
  }
  .settings-row:last-child{border-bottom:0}
  .swatch{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple))}
  .settings-row span:nth-child(2){flex:1;font-size:13.5px}
  .status-on{font:11px "JetBrains Mono",ui-monospace,monospace;color:var(--accent-green)}
  .muted-row{opacity:.5}
  .feedback-wrap{max-width:100%}
  .feedback-head h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .feedback-head p{color:var(--text-muted);font-size:13.5px;margin:0 0 28px}
  .feedback-grid{display:grid;grid-template-columns:2fr 3fr;gap:24px}
  .form{display:flex;flex-direction:column;gap:14px}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
  .input,.select,.textarea{
    width:100%;background:var(--bg-inset);border:1px solid var(--border);
    color:var(--text-primary);border-radius:7px;padding:9px 11px;font-size:13.5px
  }
  .textarea{resize:vertical}
  .input::placeholder,.textarea::placeholder{color:var(--text-dim)}
  .input:focus,.select:focus,.textarea:focus{
    outline:2px solid var(--accent-blue);outline-offset:1px;border-color:var(--accent-blue)
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:6px 11px;border-radius:7px;font-size:12.5px;border:1px solid var(--border);
    background:var(--bg-inset);color:var(--text-muted)
  }
  .chip.active{color:var(--bg-deep);font-weight:600}
  .submit{
    align-self:flex-start;padding:10px 18px;border-radius:8px;border:0;
    background:var(--accent-blue);color:var(--bg-deep);font-weight:600;font-size:13.5px
  }
  .list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .toolbar-group{display:flex;gap:8px;flex-wrap:wrap}
  .sort-btn{
    padding:5px 10px;border-radius:6px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);font-size:12px
  }
  .sort-btn.active{background:var(--bg-hover);color:var(--text-primary)}
  .feedback-list{display:flex;flex-direction:column;gap:8px}
  .feedback-card{
    display:flex;gap:12px;padding:14px 14px 14px 12px;background:var(--bg-panel);
    border-radius:9px;border-left:3px solid var(--accent-blue)
  }
  .feedback-main{flex:1;min-width:0}
  .feedback-title{font-size:14px;font-weight:600;margin-bottom:4px}
  .feedback-description{font-size:13px;color:var(--text-muted);line-height:1.5;margin:0 0 8px}
  .feedback-meta{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap}
  .vote-btn{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;
    border-radius:8px;border:1px solid var(--border);background:var(--bg-inset);color:var(--text-muted)
  }
  .vote-btn.voted{border-color:var(--accent-blue);color:var(--accent-blue);background:rgba(122,162,247,.08)}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .hidden{display:none!important}
  .error{color:var(--accent-red)!important}
  @media (max-width:900px){
    .sidebar{width:220px;flex-basis:220px}
    .feedback-grid{grid-template-columns:1fr}
  }
  @media (max-width:680px){
    .app{display:block}
    .sidebar{width:auto;height:auto;display:block;border-right:0;border-bottom:1px solid var(--border)}
    .nav{display:grid;grid-template-columns:1fr 1fr;max-height:260px}
    .view-switch{border-top:1px solid var(--border)}
    .content{padding:22px 16px}
    .topbar{padding:0 16px}
    .feedback-grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none;opacity:1}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">simonsstudios<span class="cursor"></span></div>
      <div class="brand-sub">Dashboard · Entwurf</div>
    </div>

    <nav class="nav" id="main-nav"></nav>

    <div class="view-switch">
      <div class="switch-title">Ansicht für</div>
      <div class="switches">
        <button class="group-btn active" data-group="schule" type="button">🎓 Schule</button>
        <button class="group-btn" data-group="privat" type="button">⌂ Privat</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <span>Dashboard</span><span aria-hidden="true">›</span><span class="crumb-current" id="crumb-current">Übersicht</span>
      </div>
      <div class="theme-pill">Tokyo Night</div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<script>
(() => {
  const NAV_ITEMS = [
    {id:"uebersicht",label:"Übersicht",icon:"▦",group:"both",empty:null},
    {id:"mail",label:"Mail",icon:"✉",group:"schule",empty:"Postfach folgt, sobald die IMAP-Anbindung an IServ steht."},
    {id:"stundenplan",label:"Stundenplan",icon:"□",group:"schule",empty:"Zeigt deinen Stundenplan, sobald die WebUntis-Anbindung läuft."},
    {id:"schulcloud",label:"schul.cloud",icon:"◌",group:"schule",empty:"Öffnet schul.cloud später direkt im Dashboard."},
    {id:"dokumente",label:"Dokumente",icon:"▤",group:"both",empty:"Deine Dateien erscheinen hier, sobald Nextcloud angebunden ist."},
    {id:"handschrift",label:"Handschrift",icon:"✎",group:"both",empty:"Der Handschrift-Editor kommt in einer der nächsten Ausbaustufen."},
    {id:"wiki",label:"Wiki",icon:"▧",group:"both",empty:"Wissen zum Nachschlagen — folgt in einer späteren Phase."},
    {id:"ki",label:"KI-Assistent",icon:"✦",group:"both",empty:"Hier hinterlegst du später deinen eigenen API-Schlüssel."},
    {id:"cardy",label:"Cardy",icon:"▣",group:"schule",empty:"Digitales Ausgangsticket fürs Sekretariat — erste Version folgt."},
    {id:"feedback",label:"Verbesserungsvorschläge",icon:"☼",group:"both",empty:null},
    {id:"einstellungen",label:"Einstellungen",icon:"⚙",group:"both",empty:null}
  ];

  const CATEGORIES = [
    {id:"idee",label:"Idee",color:"var(--accent-purple)"},
    {id:"verbesserung",label:"Verbesserung",color:"var(--accent-green)"},
    {id:"fehler",label:"Fehler",color:"var(--accent-red)"}
  ];

  const MODULES_FOR_FEEDBACK = [
    "Allgemein","Übersicht","Mail","Stundenplan","schul.cloud",
    "Dokumente","Handschrift","Wiki","KI-Assistent","Cardy","Design / Theme"
  ];

  const SEED_FEEDBACK = [
    {id:"f1",title:"Stundenplan als Karte auf der Startseite",category:"idee",module:"Übersicht",
     description:"Die nächsten zwei Stunden direkt auf der Übersicht anzeigen, ohne extra klicken zu müssen.",votes:7,minutesAgo:190},
    {id:"f2",title:"Radiergummi im Handschrift-Editor zu klein getroffen",category:"fehler",module:"Handschrift",
     description:"Auf dem iPad braucht es mehrere Versuche, bis der Radiergummi-Modus richtig trifft.",votes:3,minutesAgo:60},
    {id:"f3",title:"Suchfeld oben im Wiki fixieren",category:"verbesserung",module:"Wiki",
     description:"Beim Scrollen durch lange Artikel wäre eine fixierte Suche praktisch.",votes:5,minutesAgo:20}
  ];

  const state = {
    group:"schule",
    active:"uebersicht",
    feedback:SEED_FEEDBACK.map(x => ({...x})),
    voted:{},
    sortMode:"neu",
    filterCat:null,
    form:{title:"",category:"idee",module:"Allgemein",description:""}
  };

  const navEl = document.getElementById("main-nav");
  const contentEl = document.getElementById("content");
  const crumbEl = document.getElementById("crumb-current");

  function relativeTime(minutes){
    if(minutes < 1) return "gerade eben";
    if(minutes < 60) return `vor ${minutes} Min.`;
    const hours = Math.floor(minutes/60);
    if(hours < 24) return `vor ${hours} Std.`;
    const days = Math.floor(hours/24);
    return `vor ${days} Tag${days > 1 ? "en" : ""}`;
  }

  function greeting(){
    const h = new Date().getHours();
    if(h < 11) return "Guten Morgen";
    if(h < 18) return "Guten Tag";
    return "Guten Abend";
  }

  function visibleNav(){
    return NAV_ITEMS.filter(n => n.group === "both" || n.group === state.group);
  }

  function selectGroup(next){
    state.group = next;
    const stillVisible = NAV_ITEMS.find(n => n.id === state.active && (n.group === "both" || n.group === next));
    if(!stillVisible) state.active = "uebersicht";
    render();
  }

  function renderNav(){
    navEl.innerHTML = "";
    visibleNav().forEach(item => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn" + (item.id === state.active ? " active" : "");
      btn.innerHTML = `<span class="nav-icon" aria-hidden="true">${item.icon}</span>
        <span class="nav-label"></span><span class="dot"></span>`;
      btn.querySelector(".nav-label").textContent = item.label;
      const color = item.group === "schule" ? "var(--accent-cyan)" :
                    item.group === "privat" ? "var(--accent-green)" : "var(--accent-blue)";
      btn.querySelector(".dot").style.background = color;
      btn.addEventListener("click", () => { state.active = item.id; render(); });
      navEl.appendChild(btn);
    });
    document.querySelectorAll(".group-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.group === state.group);
      btn.onclick = () => selectGroup(btn.dataset.group);
    });
  }

  function renderOverview(){
    const cards = visibleNav().filter(n => n.empty);
    contentEl.innerHTML = `
      <div class="page hero">
        <h1>${greeting()}, Simon</h1>
        <p>Das ist ein erster Designentwurf für dein Dashboard. Die Navigation funktioniert schon vollständig — die Fachmodule kommen Schritt für Schritt dazu.</p>
        <button class="action-btn" id="go-feedback" type="button">☼ Verbesserungsvorschlag einreichen</button>

        <div style="margin-top:36px">
          <div class="section-kicker">Module in Planung</div>
          <div class="module-list" id="module-list"></div>
        </div>
      </div>`;
    const list = document.getElementById("module-list");
    cards.forEach(n => {
      const row = document.createElement("div");
      row.className = "module-item";
      row.innerHTML = `<span aria-hidden="true">${n.icon}</span><span class="module-name"></span><span class="planned">geplant</span>`;
      row.querySelector(".module-name").textContent = n.label;
      row.addEventListener("click", () => { state.active = n.id; render(); });
      list.appendChild(row);
    });
    document.getElementById("go-feedback").onclick = () => { state.active = "feedback"; render(); };
  }

  function renderEmpty(item){
    contentEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">${item.icon}</div>
        <h2></h2>
        <p></p>
        <button class="link-btn" type="button">Ideen dazu einreichen</button>
      </div>`;
    contentEl.querySelector("h2").textContent = item.label;
    contentEl.querySelector("p").textContent = item.empty;
    contentEl.querySelector(".link-btn").onclick = () => { state.active = "feedback"; render(); };
  }

  function renderSettings(){
    contentEl.innerHTML = `
      <div class="settings">
        <h1>Einstellungen</h1>
        <div class="section-kicker">Design</div>
        <div class="settings-card">
          <div class="settings-row">
            <div class="swatch"></div><span>Tokyo Night</span><span class="status-on">aktiv</span>
          </div>
          <div class="settings-row muted-row">
            <div class="swatch" style="background:var(--bg-hover)"></div><span>Weitere Designs</span><span class="mono" style="font-size:11px;color:var(--text-dim)">bald</span>
          </div>
        </div>

        <div class="section-kicker">Benutzergruppe</div>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.6">
          Steuert, welche Module in der Seitenleiste sichtbar sind. Aktuell ausgewählt:
          <strong id="selected-group" style="color:var(--text-primary)"></strong>.
          Umschalten geht unten links in der Seitenleiste.
        </p>
      </div>`;
    document.getElementById("selected-group").textContent = state.group === "schule" ? "Schule" : "Privat";
  }

  function renderFeedback(){
    const counts = {idee:0,verbesserung:0,fehler:0};
    state.feedback.forEach(f => counts[f.category] = (counts[f.category] || 0) + 1);

    let list = state.filterCat ? state.feedback.filter(f => f.category === state.filterCat) : state.feedback.slice();
    list = list.slice();
    if(state.sortMode === "beliebt") list.sort((a,b) => b.votes - a.votes);
    else list.sort((a,b) => a.minutesAgo - b.minutesAgo);

    contentEl.innerHTML = `
      <div class="feedback-wrap">
        <div class="feedback-head">
          <h1>Verbesserungsvorschläge</h1>
          <p>Sammelstelle für Ideen, Verbesserungen und gemeldete Fehler — bewertbar per Stimme.</p>
        </div>

        <div class="feedback-grid">
          <form class="form" id="feedback-form">
            <div class="field">
              <label for="fb-title">Titel</label>
              <input class="input" id="fb-title" placeholder="Kurz und konkret" required>
            </div>

            <div class="field">
              <label>Kategorie</label>
              <div class="chips" id="category-chips"></div>
            </div>

            <div class="field">
              <label for="fb-module">Bereich</label>
              <select class="select" id="fb-module"></select>
            </div>

            <div class="field">
              <label for="fb-description">Beschreibung</label>
              <textarea class="textarea" id="fb-description" rows="4" placeholder="Was genau schlägst du vor?"></textarea>
            </div>

            <button class="submit" type="submit">Absenden</button>
          </form>

          <div>
            <div class="list-toolbar">
              <div class="toolbar-group" id="filter-chips"></div>
              <div class="toolbar-group">
                <button class="sort-btn ${state.sortMode === "neu" ? "active" : ""}" data-sort="neu" type="button">Neu</button>
                <button class="sort-btn ${state.sortMode === "beliebt" ? "active" : ""}" data-sort="beliebt" type="button">Beliebt</button>
              </div>
            </div>
            <div class="feedback-list" id="feedback-list"></div>
          </div>
        </div>
      </div>`;

    const title = document.getElementById("fb-title");
    const desc = document.getElementById("fb-description");
    title.value = state.form.title;
    desc.value = state.form.description;

    const moduleSelect = document.getElementById("fb-module");
    MODULES_FOR_FEEDBACK.forEach(m => {
      const option = document.createElement("option");
      option.value = m; option.textContent = m;
      option.selected = m === state.form.module;
      moduleSelect.appendChild(option);
    });

    const catWrap = document.getElementById("category-chips");
    CATEGORIES.forEach(c => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (state.form.category === c.id ? " active" : "");
      btn.textContent = c.label;
      if(state.form.category === c.id){
        btn.style.background = c.color;
        btn.style.borderColor = c.color;
      }
      btn.onclick = () => { state.form.category = c.id; renderFeedback(); };
      catWrap.appendChild(btn);
    });

    const filterWrap = document.getElementById("filter-chips");
    CATEGORIES.forEach(c => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (state.filterCat === c.id ? " active" : "");
      btn.textContent = `${c.label} · ${counts[c.id] || 0}`;
      if(state.filterCat === c.id){
        btn.style.background = c.color;
        btn.style.borderColor = c.color;
      }
      btn.onclick = () => {
        state.filterCat = state.filterCat === c.id ? null : c.id;
        renderFeedback();
      };
      filterWrap.appendChild(btn);
    });

    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.onclick = () => { state.sortMode = btn.dataset.sort; renderFeedback(); };
    });

    document.getElementById("feedback-form").addEventListener("submit", e => {
      e.preventDefault();
      const titleText = title.value.trim();
      if(!titleText) return;

      state.feedback.unshift({
        id:`f${Date.now()}`,
        title:titleText,
        category:state.form.category,
        module:moduleSelect.value,
        description:desc.value.trim(),
        votes:0,
        minutesAgo:0
      });
      state.form = {title:"",category:"idee",module:"Allgemein",description:""};
      renderFeedback();
    });

    const listEl = document.getElementById("feedback-list");

    if(!list.length){
      const empty = document.createElement("div");
      empty.style.cssText = "color:var(--text-dim);font-size:13px;padding:20px 0";
      empty.textContent = "Noch nichts in dieser Kategorie.";
      listEl.appendChild(empty);
    }

    list.forEach(item => {
      const cat = CATEGORIES.find(c => c.id === item.category) || CATEGORIES[0];
      const card = document.createElement("div");
      card.className = "feedback-card";
      card.style.borderLeftColor = cat.color;
      card.innerHTML = `
        <div class="feedback-main">
          <div class="feedback-title"></div>
          <p class="feedback-description"></p>
          <div class="feedback-meta">
            <span class="mono cat-name"></span>
            <span class="module-name"></span>
            <span class="mono time"></span>
          </div>
        </div>
        <button class="vote-btn ${state.voted[item.id] ? "voted" : ""}" type="button" aria-label="Abstimmen">
          <span style="font-size:14px">↑</span>
          <span class="mono votes"></span>
        </button>`;
      card.querySelector(".feedback-title").textContent = item.title;
      card.querySelector(".feedback-description").textContent = item.description;
      card.querySelector(".cat-name").textContent = cat.label;
      card.querySelector(".cat-name").style.color = cat.color;
      card.querySelector(".module-name").textContent = item.module;
      card.querySelector(".time").textContent = relativeTime(item.minutesAgo);
      card.querySelector(".votes").textContent = item.votes;
      card.querySelector(".vote-btn").onclick = () => {
        const already = !!state.voted[item.id];
        item.votes += already ? -1 : 1;
        state.voted[item.id] = !already;
        renderFeedback();
      };
      listEl.appendChild(card);
    });
  }

  function render(){
    const item = NAV_ITEMS.find(n => n.id === state.active) || NAV_ITEMS[0];
    crumbEl.textContent = item.label;
    renderNav();

    if(state.active === "uebersicht") return renderOverview();
    if(state.active === "feedback") return renderFeedback();
    if(state.active === "einstellungen") return renderSettings();
    if(item.empty) return renderEmpty(item);

    contentEl.innerHTML = "";
  }

  render();
})();
</script>
</body>
</html>

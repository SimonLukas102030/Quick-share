<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School AIO</title>
<!--
  ============================================================================
  School AIO — Dashboard Prototyp (Frontend, KEIN Backend)
  ============================================================================
  Hinweis für alle, die hier weiterarbeiten:
  - Diese Datei ist bewusst EIN einzelnes HTML-File (per Doppelklick offenbar,
    kein Build-Schritt, kein Server nötig). Sobald die echte Umsetzung mit
    einem Backend beginnt (siehe Entwicklungsplan: NestJS + Next.js), wird
    das hier 1:1 in echte Komponenten/Module aufgeteilt.
  - Die Datei ist unten in klar mit Bannern markierte Abschnitte gegliedert
    (CSS-Themes, State, Helpers, pro Modul ein Abschnitt, Router, Init).
  - Alle Daten liegen aktuell nur im Arbeitsspeicher (kein localStorage,
    kein Server) — ein Reload setzt alles zurück. Das ist so gewollt.
  - Suche nach "TODO(backend)" für Stellen, an denen später eine echte
    API angebunden werden muss.
  ============================================================================
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* ==========================================================================
   1) THEMES — Tokyo Night (Standard), Clean Dark, Clean Light
   Jedes Theme setzt nur Farb-/Radius-Variablen, keine Layout-Regeln.
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root, html[data-theme="tokyo-night"] {
  --bg-deep: #1a1b26; --bg-panel: #1f2335; --bg-inset: #16161e; --bg-hover: #292e42;
  --border: #2d3149;
  --text-primary: #c0caf5; --text-muted: #8188b3; --text-dim: #565f89;
  --accent-blue: #7aa2f7; --accent-purple: #bb9af7; --accent-cyan: #7dcfff;
  --accent-green: #9ece6a; --accent-yellow: #e0af68; --accent-red: #f7768e;
  --radius: 12px;
}
html[data-theme="clean-dark"] {
  --bg-deep: #18181b; --bg-panel: #202024; --bg-inset: #131316; --bg-hover: #28282d;
  --border: #2c2c31;
  --text-primary: #e6e6e9; --text-muted: #9a9aa3; --text-dim: #66666d;
  --accent-blue: #5b8def; --accent-purple: #8c7ae6; --accent-cyan: #4fb3c9;
  --accent-green: #5fae67; --accent-yellow: #c99a3f; --accent-red: #d1615c;
  --radius: 8px;
}
html[data-theme="clean-light"] {
  --bg-deep: #f7f7f8; --bg-panel: #ffffff; --bg-inset: #f0f0f2; --bg-hover: #e9e9ec;
  --border: #e0e0e4;
  --text-primary: #1c1c1f; --text-muted: #6b6b72; --text-dim: #9a9aa1;
  --accent-blue: #3568d4; --accent-purple: #7952d1; --accent-cyan: #1f8ba7;
  --accent-green: #3c8a48; --accent-yellow: #a8730b; --accent-red: #c2453f;
  --radius: 8px;
}

/* ==========================================================================
   2) BASE / RESET
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-deep); color: var(--text-primary);
  font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
  transition: background-color .15s ease, color .15s ease;
}
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
button, input, select, textarea { font-family: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 8px; }
a { color: var(--accent-blue); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   3) CLEAN ANIMATIONS — dezent, konsistent, ein Muster für alles
   ========================================================================== */
@keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
.page-enter { animation: fadeSlideIn .2s ease both; }

/* ==========================================================================
   4) APP SHELL / TOPBAR
   ========================================================================== */
#app { height: 100vh; display: flex; flex-direction: column; }

#topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg-deep);
  position: relative; z-index: 20;
}
#brand { font-size: 17px; font-weight: 600; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-primary);
  transition: background-color .12s;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent-blue); color: var(--bg-deep); border-color: var(--accent-blue); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.danger-outline { color: var(--accent-red); border-color: var(--accent-red); background: transparent; }

.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  color: var(--bg-deep); font-weight: 700; font-size: 12.5px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;
}

#profile-menu {
  position: absolute; top: 52px; right: 20px; width: 230px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; display: none; flex-direction: column; gap: 4px;
  box-shadow: 0 12px 28px rgba(0,0,0,.35); animation: popIn .12s ease;
}
#profile-menu.open { display: flex; }
#profile-menu .pname { font-weight: 600; font-size: 14px; padding: 4px 6px 0; }
#profile-menu .pmail { font-size: 11.5px; color: var(--text-dim); padding: 0 6px 8px; }
.menu-item { padding: 8px 6px; font-size: 13px; border-radius: 6px; cursor: pointer; color: var(--text-muted); }
.menu-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.menu-sep { height: 1px; background: var(--border); margin: 5px 2px; }

/* KI-Assistent — Overlay-Panel von rechts, unabhängig vom Seiten-Router */
#ki-overlay {
  position: fixed; top: 56px; right: 0; bottom: 0; width: 380px; max-width: 92vw;
  background: var(--bg-panel); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .18s ease;
  z-index: 85; display: flex; flex-direction: column;
}
#ki-overlay.open { transform: translateX(0); }
.ki-ov-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.ki-ov-head .title { font-weight: 600; font-size: 14.5px; }
.ki-ov-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.ki-ov-quick { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.ki-ov-quick button { text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-inset); color: var(--text-muted); font-size: 12.5px; cursor: pointer; }
.ki-ov-quick button:hover { color: var(--text-primary); background: var(--bg-hover); }
.ki-ov-log { display: flex; flex-direction: column; gap: 8px; }
.ki-ov-msg { padding: 9px 11px; border-radius: 9px; font-size: 12.5px; line-height: 1.5; max-width: 92%; }
.ki-ov-msg.user { align-self: flex-end; background: var(--accent-blue); color: var(--bg-deep); }
.ki-ov-msg.assistant { align-self: flex-start; background: var(--bg-inset); color: var(--text-primary); }
.ki-ov-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.ki-ov-foot input { flex: 1; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13px; color: var(--text-primary); }

/* ==========================================================================
   0-b) KI-Overlay Ende
   ========================================================================== */

   5) LANDING (ausgeloggt)
   ========================================================================== */
#landing { flex: 1; display: flex; align-items: center; justify-content: center; }
#landing.hidden { display: none; }
#motto { font-size: 32px; font-weight: 600; min-height: 44px; text-align: center; }
#motto .bar {
  display: inline-block; width: 3px; height: 30px; background: var(--accent-cyan);
  margin-left: 4px; vertical-align: -6px; animation: blink 0.9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#landing-sub { text-align: center; margin-top: 8px; color: var(--text-dim); font-size: 13.5px; }

/* ==========================================================================
   6) DASHBOARD LAYOUT (eingeloggt)
   ========================================================================== */
#dashboard { flex: 1; display: none; min-height: 0; }
#dashboard.visible { display: flex; }

#iconrail {
  width: 56px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 14px 0;
}
.rail-scroll { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; overflow-y: auto; }
.rail-btn {
  width: 38px; height: 38px; border-radius: 9px; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  cursor: pointer; position: relative; color: var(--text-muted); opacity: .85;
}
.rail-btn:hover { background: var(--bg-hover); opacity: 1; color: var(--text-primary); }
.rail-btn.active { background: var(--bg-hover); opacity: 1; color: var(--accent-blue); }
.rail-btn .tip {
  position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
  background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-primary);
  font-size: 12px; padding: 5px 10px; border-radius: 6px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 30;
}
.rail-btn:hover .tip { opacity: 1; }
.rail-group-toggle { display: flex; flex-direction: column; gap: 4px; padding: 8px 8px 0; }
.rail-group-btn {
  width: 38px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-inset);
  color: var(--text-dim); font-size: 14px; cursor: pointer;
}
.rail-group-btn.active { color: var(--bg-deep); background: var(--accent-cyan); border-color: var(--accent-cyan); }

#main { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 32px 60px; }
#greeting { font-size: 24px; font-weight: 600; margin: 0 0 2px; }
#greeting-date { color: var(--text-muted); font-size: 13.5px; margin-bottom: 22px; }

.page-header { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.page-sub { color: var(--text-muted); font-size: 13.5px; }

.notice-box {
  border: 1px dashed var(--border); border-radius: var(--radius); padding: 16px 18px;
  color: var(--text-muted); font-size: 13.5px; line-height: 1.6; max-width: 520px;
}

/* ==========================================================================
   7) WIDGET GRID (nur Übersicht) — feste Slots
   ========================================================================== */
#widget-grid {
  display: grid; grid-template-columns: 1fr 1.35fr 1fr; grid-template-rows: auto 1fr;
  grid-template-areas: "slotA slotB slotD" "slotA slotC slotD"; gap: 16px;
  min-height: calc(100vh - 200px);
}
@media (max-width: 880px) {
  #widget-grid { grid-template-columns: 1fr; grid-template-rows: none;
    grid-template-areas: "slotA" "slotB" "slotC" "slotD"; min-height: auto; }
}
.widget {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column; min-height: 0;
}
.widget-empty {
  border: 1px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center;
  justify-content: center; color: var(--text-dim); font-size: 13px; cursor: pointer;
  background: transparent; min-height: 90px; text-align: center; padding: 12px;
}
.widget-empty:hover { color: var(--text-primary); border-color: var(--text-dim); }
.widget-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13.5px;
  display: flex; align-items: center; justify-content: space-between; cursor: default; flex-shrink: 0;
}
.widget-head.clickable { cursor: pointer; }
.widget-head.clickable:hover { color: var(--accent-cyan); }
.widget-body { padding: 12px 14px; overflow-y: auto; flex: 1; min-height: 0; }

/* Nachrichten (Widget + volle Mail-Seite teilen sich diese Klassen) */
.msg-item { padding: 9px 10px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--bg-inset); border: 1px solid transparent; }
.msg-item:hover { border-color: var(--border); }
.msg-item.active { border-color: var(--accent-blue); }
.msg-item.unread .msg-sender::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-blue); margin-right: 6px; }
.msg-sender { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; }
.msg-item.unread .msg-sender { color: var(--text-primary); }
.msg-item:not(.unread) .msg-sender { color: var(--text-dim); }
.msg-source { font-size: 10px; color: var(--text-dim); margin-left: auto; }
.msg-preview { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.4;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.quick-btn { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 8px; background: var(--bg-inset); border: 1px solid var(--border); color: var(--accent-cyan); font-size: 13px; cursor: pointer; margin-bottom: 6px; }
.quick-btn:hover { background: var(--bg-hover); }

/* Kalender */
.cal-tabs { display: flex; gap: 4px; }
.cal-tab { font-size: 11.5px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; }
.cal-tab.active { background: var(--bg-hover); color: var(--text-primary); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav-btn { background: var(--bg-inset); border: 1px solid var(--border); color: var(--text-muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.cal-nav-btn:hover { color: var(--text-primary); }
.cal-month-label { font-size: 13px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-weekday { font-size: 10.5px; color: var(--text-dim); text-align: center; padding-bottom: 4px; }
.cal-day { aspect-ratio: 1; border-radius: 7px; background: var(--bg-inset); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--text-muted); cursor: pointer; gap: 3px; }
.cal-day:hover { background: var(--bg-hover); color: var(--text-primary); }
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.today { border: 1px solid var(--accent-blue); color: var(--text-primary); font-weight: 600; }
.cal-day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-cyan); }
.cal-entry { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.cal-entry:last-child { border-bottom: none; }

/* WebUntis / Stunden-Karten (Widget + Stundenplan-Seite) */
.period { border-radius: 9px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--border); }
.period-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 11px; font-weight: 600; font-size: 13.5px; color: var(--bg-deep); }
.period-room { font-size: 11.5px; opacity: .85; }
.period-body { background: var(--bg-inset); padding: 9px 11px; }
.period-teacher { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
.period-status { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.status-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--bg-deep); flex-shrink: 0; }
.status-label { flex: 1; }
.more-info { font-size: 11.5px; color: var(--accent-blue); cursor: pointer; text-decoration: underline; }

/* ==========================================================================
   8) MAIL-SEITE
   ========================================================================== */
.mail-layout { display: grid; grid-template-columns: 180px 300px 1fr; gap: 16px; height: calc(100vh - 190px); min-height: 400px; }
.mail-folders { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.mail-folder { padding: 8px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--text-muted); display: flex; justify-content: space-between; }
.mail-folder:hover { background: var(--bg-hover); }
.mail-folder.active { background: var(--bg-hover); color: var(--text-primary); font-weight: 600; }
.mail-folder .count { font-size: 11px; color: var(--text-dim); }
.mail-list { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; overflow-y: auto; }
.mail-reading { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; overflow-y: auto; }
.mail-reading .subject { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.mail-reading .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
.mail-reading .body { font-size: 13.5px; line-height: 1.7; color: var(--text-primary); white-space: pre-wrap; }
.mail-empty { color: var(--text-dim); font-size: 13px; display: flex; align-items: center; justify-content: center; height: 100%; }

/* ==========================================================================
   8-b) CHATS-SEITE (WhatsApp-artig — Direktnachrichten & Gruppen)
   ========================================================================== */
.chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 190px); min-height: 400px; }
.chat-list { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.chat-list-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.chat-list-item:hover { background: var(--bg-hover); }
.chat-list-item.active { background: var(--bg-hover); }
.chat-list-item .name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.chat-list-item .last { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-conversation { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; }
.chat-conv-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13.5px; }
.chat-conv-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-bubble { max-width: 70%; padding: 9px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
.chat-bubble.self { align-self: flex-end; background: var(--accent-blue); color: var(--bg-deep); border-bottom-right-radius: 3px; }
.chat-bubble.other { align-self: flex-start; background: var(--bg-inset); color: var(--text-primary); border-bottom-left-radius: 3px; }
.chat-bubble .meta { font-size: 10px; opacity: .7; margin-top: 3px; display: block; }
.chat-conv-foot { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.chat-conv-foot input { flex: 1; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 13px; color: var(--text-primary); }

/* ==========================================================================
   9) STUNDENPLAN-SEITE (Wochenraster)
   ========================================================================== */
.tt-grid { display: grid; grid-template-columns: 56px repeat(5, 1fr); gap: 6px; }
.tt-head { font-size: 12px; color: var(--text-dim); text-align: center; padding: 6px 0; }
.tt-slot-label { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
.tt-cell { min-height: 68px; border-radius: 8px; padding: 6px 8px; font-size: 11.5px; cursor: default; display: flex; flex-direction: column; gap: 3px; }
.tt-cell.empty { background: var(--bg-inset); opacity: .35; }
.tt-cell .tt-subject { font-weight: 700; font-size: 12.5px; }
.tt-cell .tt-room { opacity: .85; }
.tt-cell .tt-status { margin-top: auto; font-size: 10.5px; text-decoration: underline; cursor: pointer; }

/* ==========================================================================
   10) DOKUMENTE-SEITE
   ========================================================================== */
.docs-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); margin-bottom: 14px; flex-wrap: wrap; }
.docs-breadcrumb span.seg { cursor: pointer; }
.docs-breadcrumb span.seg:hover { color: var(--accent-blue); }
.docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.docs-item { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 10px; text-align: center; cursor: pointer; }
.docs-item:hover { background: var(--bg-hover); }
.docs-item .icon { font-size: 26px; margin-bottom: 8px; }
.docs-item .name { font-size: 12px; word-break: break-word; }

/* ==========================================================================
   11) NOTIZEN-SEITE (GoodNotes-artig: Textfelder auf einer Zeichenfläche)
   ========================================================================== */
.hs-layout { display: grid; grid-template-columns: 56px 1fr 130px; gap: 14px; height: calc(100vh - 190px); }
.hs-tools { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; }
.hs-tool { width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-size: 16px; cursor: pointer; }
.hs-tool:hover { background: var(--bg-hover); color: var(--text-primary); }
.hs-tool.active { background: var(--accent-blue); color: var(--bg-deep); }
.hs-canvas {
  position: relative; overflow: hidden;
  background: repeating-linear-gradient(0deg, var(--bg-inset), var(--bg-inset) 27px, var(--bg-panel) 28px);

const SUBJECT_ALIASES = {
  mathe:"Mathematik", math:"Mathematik", matheh:"Mathematik", mathematik:"Mathematik",
  deutsch:"Deutsch", de:"Deutsch",
  physik:"Physik", phy:"Physik",
  englisch:"Englisch", eng:"Englisch", en:"Englisch",
  chemie:"Chemie", che:"Chemie",
  bio:"Biologie", biologie:"Biologie",
  latein:"Latein", la:"Latein"
};
function normalizeSubject(input) {
  const key = input.trim().toLowerCase();
  return SUBJECT_ALIASES[key] || (input.charAt(0).toUpperCase() + input.slice(1));
}
// Liefert die Fach-Farbe. Erst manuelle Einstellung (Fächer & Farben), sonst
// automatisch zugewiesen (und dabei dauerhaft in state.subjectColors gemerkt,
// damit sie in den Einstellungen editierbar wird).
function getSubjectColor(subject) {
  if (!state.subjectColors[subject]) {
    const idx = Object.keys(state.subjectColors).length % COLOR_CYCLE.length;
    state.subjectColors[subject] = COLOR_CYCLE[idx];
  }
  return `var(${state.subjectColors[subject]})`;
}
function docFolderIdForSubject(subject) {
  // Ordner-Ids folgen im Prototyp direkt aus dem kleingeschriebenen Fachnamen.
  // TODO(backend): durch echte Nextcloud-Ordner-Zuordnung ersetzen.
  const known = ["mathematik","deutsch","physik"];
  const id = subject.toLowerCase();
  return known.includes(id) ? id : null;
}
// Erkennt anhand von Titel/Inhalt eines Texts, zu welchem bekannten Fach er
// am ehesten passt (simple Stichwortsuche) — genutzt von der KI-Ablage für
// Notizen (Nextcloud-Ordner + Wiki-Collective).
function guessSubjectFromText(text) {
  const lower = text.toLowerCase();
  for (const subject of state.subjectsList) {
    if (lower.includes(subject.toLowerCase())) return subject;
  }
  for (const alias of Object.keys(SUBJECT_ALIASES)) {
    if (lower.includes(alias)) return SUBJECT_ALIASES[alias];
  }
  return null;
}
function guessWikiCollectiveId(subject) {
  if (!subject) return null;
  const match = state.wiki.collectives.find((c) => c.name.toLowerCase() === subject.toLowerCase());
  return match ? match.id : null;
}

// Baut das Inline-Style für eine Fach-/Stunden-Karte, je nach gewählter
// Stundenplan-Darstellung (Einstellungen → Design). "bunt" = wie bisher
// volle Fachfarbe, "dezent" = nur Akzent-Rand, "neutral" = neutrale Karte
// mit kleinem Farbpunkt vor dem Fachnamen.
function subjectCardStyle(colorExpr) {
  const mode = state.stundenplanStyle;
  if (mode === "dezent") return `background:var(--bg-inset);color:var(--text-primary);border-left:3px solid ${colorExpr};`;
  if (mode === "neutral") return `background:var(--bg-inset);color:var(--text-primary);`;
  return `background:${colorExpr};color:var(--bg-deep);`; // "bunt" (Standard)
}
function subjectDot(colorExpr) {
  return state.stundenplanStyle === "neutral"
    ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorExpr};margin-right:6px;"></span>`
    : "";
}
function findDocNode(pathIds) {
  let node = state.docs.tree;
  for (let i = 1; i < pathIds.length; i++) {
    node = (node.children || []).find((c) => c.id === pathIds[i]);
    if (!node) return state.docs.tree;
  }
  return node;
}
function findFolderById(node, id) {
  if (node.id === id) return node;
  for (const child of node.children || []) {
    if (child.type === "folder") {
      const found = findFolderById(child, id);
      if (found) return found;
    }
  }
  return null;
}
function addFileToFolder(folderId, name, kind) {
  const folder = findFolderById(state.docs.tree, folderId) || findFolderById(state.docs.tree, "sonstiges");
  folder.children.push({ id: "f" + Date.now(), name, type:"file", kind });
  return folder;
}
function findWikiPage(pages, id, trail) {
  for (const p of pages) {
    const nextTrail = [...trail, p];
    if (p.id === id) return nextTrail;
    const found = findWikiPage(p.children, id, nextTrail);
    if (found) return found;
  }
  return null;
}

let mottoIdx = 0;
function typeMotto() {
  const target = MOTTOS[mottoIdx % MOTTOS.length];
  const node = document.getElementById("motto-text");
  let i = 0;
  const typeStep = () => {
    node.textContent = target.slice(0, i); i++;
    if (i <= target.length) setTimeout(typeStep, 55); else setTimeout(eraseStep, 1600);
  };
  const eraseStep = () => {
    if (i > 0) { i--; node.textContent = target.slice(0, i); setTimeout(eraseStep, 30); }
    else { mottoIdx++; setTimeout(typeMotto, 300); }
  };
  typeStep();
}

/* ============================================================================
   KI-ASSISTENT — Overlay-Panel (Topbar). Unabhängig vom Seiten-Router: bleibt
   offen, während man durchs Dashboard navigiert. Kontext-Aktionen richten
   sich nach der gerade aktiven Seite (z. B. "Nachricht zusammenfassen" nur
   auf der Mail-Seite mit geöffneter Nachricht).
   WICHTIG: Jede Aktion, die Inhalte an den KI-Anbieter schickt, läuft über
   requestAIConsent() — ausnahmslos, siehe Anforderung.
   ============================================================================ */
function renderKIOverlay() {
  const panel = document.getElementById("ki-overlay");
  panel.classList.toggle("open", state.kiOverlayOpen);
  if (!state.kiOverlayOpen) { panel.innerHTML = ""; return; }

  const provider = activeAIProvider();
  panel.innerHTML = `
    <div class="ki-ov-head">
      <span class="title">✨ KI-Assistent</span>
      <button class="modal-close" id="ki-ov-close" style="float:none;">✕</button>
    </div>
    <div class="ki-ov-body" id="ki-ov-body"></div>
    <div class="ki-ov-foot" id="ki-ov-foot"></div>
  `;
  panel.querySelector("#ki-ov-close").onclick = () => { state.kiOverlayOpen = false; renderKIOverlay(); };

  const body = panel.querySelector("#ki-ov-body");

  if (!provider) {
    body.appendChild(el(`
      <div class="ki-system-msg" style="align-self:flex-start;">Keine API hinterlegt.</div>
      <p style="font-size:12.5px;color:var(--text-muted);line-height:1.6;">
        Hinterlege einen API-Schlüssel, um den Assistenten nutzen zu können.
      </p>
    `));
    const goBtn = el(`<button class="btn primary small">Zu den Einstellungen</button>`);
    goBtn.onclick = () => { state.kiOverlayOpen = false; renderKIOverlay(); goTo("einstellungen", "ki"); };
    body.appendChild(goBtn);
    panel.querySelector("#ki-ov-foot").remove();
    return;
  }

  // Kontextbezogene Schnellaktionen je nach aktiver Seite
  const quick = el(`<div class="ki-ov-quick"></div>`);
  if (state.activePage === "mail" && state.mail.activeMessageId) {
    const msg = state.mail.messages.find((m) => m.id === state.mail.activeMessageId);
    const btn = el(`<button>📄 Diese Mail zusammenfassen</button>`);
    btn.onclick = () => requestAIConsent(
      `Der Inhalt der Nachricht „${msg.subject}" von ${msg.sender} wird an ${provider} gesendet.`,
      () => {
        pushKILog("user", `Fasse „${msg.subject}" zusammen.`);
        pushKILog("assistant", `Zusammenfassung (simuliert): ${msg.sender} fragt nach „${msg.subject.toLowerCase()}" — kurze, klare Antwort genügt.`);
      }
    );
    quick.appendChild(btn);
  }
  if (state.activePage === "notizen") {
    const btn = el(`<button>📝 Aktuelle Notiz vervollständigen</button>`);
    btn.onclick = () => requestAIConsent(
      `Der Text der aktuellen Notizseite wird an ${provider} gesendet.`,
      () => {
        pushKILog("user", "Vervollständige meine aktuelle Notiz.");
        pushKILog("assistant", 'Notiz ergänzt und Rechtschreibung korrigiert (simuliert). Nutze „Exportieren" in den Notizen, um das Ergebnis zu übernehmen.');
      }
    );
    quick.appendChild(btn);
  }
  const searchBtn = el(`<button>🔎 Dashboard durchsuchen</button>`);
  searchBtn.onclick = () => {
    const q = prompt("Wonach suchen? (Mail, Wiki, Dokumente)");
    if (!q) return;
    const results = searchDashboard(q);
    pushKILog("user", `Suche: „${q}"`);
    pushKILog("assistant", results.length
      ? "Gefunden: " + results.map((r) => r.label).join(" · ")
      : "Nichts gefunden.");
  };
  quick.appendChild(searchBtn);
  if (quick.children.length) body.appendChild(quick);

  const log = el(`<div class="ki-ov-log"></div>`);
  state.kiLog.forEach((entry) => log.appendChild(el(`<div class="ki-ov-msg ${entry.role}">${entry.text}</div>`)));
  body.appendChild(log);
  body.scrollTop = body.scrollHeight;

  const foot = panel.querySelector("#ki-ov-foot");
  const input = el(`<input placeholder="Frage stellen …" />`);
  const send = el(`<button class="btn primary small">Senden</button>`);
  const doSend = () => {
    const val = input.value.trim();
    if (!val) return;
    requestAIConsent(`Deine Nachricht „${val}" wird an ${provider} gesendet.`, () => {
      pushKILog("user", val);
      pushKILog("assistant", "Antwort folgt in einer späteren Ausbaustufe (Chat-Funktion ist aktuell nur simuliert).");
      input.value = "";
    });
  };
  send.onclick = doSend;
  input.onkeydown = (e) => { if (e.key === "Enter") doSend(); };
  foot.appendChild(input); foot.appendChild(send);
}
function pushKILog(role, text) {
  state.kiLog.push({ role, text });
  renderKIOverlay();
}
// Rein lokale Dashboard-Suche — sendet NICHTS an einen KI-Anbieter, daher
// ohne requestAIConsent(). Durchsucht Mail-Betreffs, Wiki-Seitentitel und
// Dateinamen in Dokumente.
function searchDashboard(query) {
  const q = query.toLowerCase();
  const results = [];
  state.mail.messages.forEach((m) => { if (m.subject.toLowerCase().includes(q)) results.push({ label:`Mail: ${m.subject}` }); });
  function walkWiki(pages, collectiveName) {
    pages.forEach((p) => {
      if (p.title.toLowerCase().includes(q)) results.push({ label:`Wiki (${collectiveName}): ${p.title}` });
      walkWiki(p.children, collectiveName);
    });
  }
  state.wiki.collectives.forEach((c) => walkWiki(c.pages, c.name));
  function walkDocs(node) {
    (node.children || []).forEach((n) => {
      if (n.name.toLowerCase().includes(q)) results.push({ label:`Datei: ${n.name}` });
      if (n.type === "folder") walkDocs(n);
    });
  }
  walkDocs(state.docs.tree);
  return results.slice(0, 8);
}

function buildKalenderWidget() {
  const box = document.createElement("div");
  const tabs = el(`<div class="cal-tabs" style="margin-bottom:10px;"></div>`);
  ["Tag","Woche","Monat","Jahr"].forEach((v) => {
    const t = el(`<button class="cal-tab ${v === "Monat" ? "active" : ""}">${v}</button>`);
    t.onclick = () => { if (v !== "Monat") showToast(v + "-Ansicht folgt später — hier erstmal die Monatsansicht."); };
    tabs.appendChild(t);
  });
  box.appendChild(tabs);

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + state.calMonthOffset);
  const nav = el(`
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <span class="cal-month-label">${MONTH_NAMES[base.getMonth()]} ${base.getFullYear()}</span>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
  `);
  box.appendChild(nav);
  nav.querySelector("#cal-prev").onclick = () => { state.calMonthOffset--; renderWidgets(); };
  nav.querySelector("#cal-next").onclick = () => { state.calMonthOffset++; renderWidgets(); };

  const calendarByKey = {};
  state.calendarEntries.forEach((entry) => {
    const d = new Date(); d.setDate(d.getDate() + entry.offsetDays);
    const key = dateKey(d);
    (calendarByKey[key] = calendarByKey[key] || []).push({ label: entry.label });
  });

  const grid = el(`<div class="cal-grid"></div>`);
  WEEKDAYS.slice(0,7).forEach((w) => grid.appendChild(el(`<div class="cal-weekday">${w}</div>`)));
  const firstOfMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const today = new Date();
  for (let i = 0; i < leadingBlanks; i++) grid.appendChild(el(`<div class="cal-day empty"></div>`));
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(base.getFullYear(), base.getMonth(), day);
    const key = dateKey(d);
    const isToday = dateKey(today) === key;
    const entries = calendarByKey[key] || [];
    const cell = el(`<div class="cal-day ${isToday ? "today" : ""}"><span>${day}</span>${entries.length ? '<span class="dot"></span>' : ""}</div>`);
    cell.onclick = () => {
      if (entries.length === 0) { showToast("Keine Termine an diesem Tag."); return; }
      const rows = entries.map((e) => `<div class="cal-entry">${e.label}</div>`).join("");
      openModal(`<h3>${day}. ${MONTH_NAMES[base.getMonth()]} ${base.getFullYear()}</h3><div style="margin-top:10px;">${rows}</div>`);
    };
    grid.appendChild(cell);
  }
  box.appendChild(grid);
  return box;
}

function openWidgetMenu(e, widget) {
  e.preventDefault();
  const menu = document.getElementById("ctxmenu");
  const others = state.widgets.filter((w) => w.id !== widget.id && !w.hidden);
  const swapRows = others.map((w) => `<div class="ctx-item" data-swap="${w.id}">Tauschen mit „${w.title}"</div>`).join("");
  menu.innerHTML = `${swapRows}<div class="ctx-sep"></div><div class="ctx-item danger" data-act="remove">Entfernen</div>`;
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.classList.add("open");
  menu.querySelectorAll("[data-swap]").forEach((item) => {
    item.onclick = () => {
      const other = state.widgets.find((w) => w.id === item.dataset.swap);
      const tmp = widget.slot; widget.slot = other.slot; other.slot = tmp;
      closeCtx(); renderWidgets();
    };
  });
  menu.querySelector('[data-act="remove"]').onclick = () => {
    widget.hidden = true; closeCtx(); renderWidgets();
    showToast(widget.title + " ausgeblendet — Slot anklicken, um es zurückzuholen.");
  };
}

function renderWidgets() {
  const grid = document.getElementById("widget-grid");
  if (!grid) return;
  grid.innerHTML = "";
  ["slotA", "slotB", "slotC", "slotD"].forEach((slotId) => {
    const w = state.widgets.find((x) => x.slot === slotId);
    if (!w) return;
    if (w.hidden) {
      const empty = el(`<div class="widget-empty">+ „${w.title}" wieder anzeigen</div>`);
      empty.style.gridArea = slotId;
      empty.onclick = () => { w.hidden = false; renderWidgets(); };
      grid.appendChild(empty);
      return;
    }
    const card = document.createElement("div");
    card.className = "widget";
    card.style.gridArea = slotId;
    const clickable = !!WIDGET_HEAD_CLICK[w.id];
    const head = el(`<div class="widget-head ${clickable ? "clickable" : ""}">${w.title}</div>`);
    if (clickable) head.onclick = WIDGET_HEAD_CLICK[w.id];
    head.addEventListener("contextmenu", (e) => openWidgetMenu(e, w));
    const body = document.createElement("div");
    body.className = "widget-body";
    body.appendChild(WIDGET_BUILDERS[w.id]());
    body.addEventListener("contextmenu", (e) => openWidgetMenu(e, w));
    card.appendChild(head); card.appendChild(body);
    grid.appendChild(card);
  });
}

   Freunde sind anschreibbar). TODO(backend): echte Echtzeit-Zustellung

function renderChats(main) {
  main.appendChild(el(`
    <div class="page-header">
      <div class="page-title">Chats</div>
      <div class="page-sub">Direktnachrichten und Gruppen</div>
    </div>
  `));

  const layout = el(`<div class="chat-layout"></div>`);

  const list = el(`<div class="chat-list"></div>`);
  const newGroupBtn = el(`<button class="btn small" style="margin-bottom:8px;">+ Neue Gruppe</button>`);
  newGroupBtn.onclick = openNewGroupModal;
  list.appendChild(newGroupBtn);

  const sorted = [...state.chats.conversations];
  sorted.forEach((conv) => {
    const last = conv.messages[conv.messages.length - 1];
    const item = el(`
      <div class="chat-list-item ${state.chats.activeId === conv.id ? "active" : ""}">
        <div class="name">${conv.type === "group" ? "👥" : "👤"} ${conv.name}</div>
        <div class="last">${last ? last.text : "Noch keine Nachrichten"}</div>
      </div>
    `);
    item.onclick = () => { state.chats.activeId = conv.id; renderPage(); };
    list.appendChild(item);
  });
  layout.appendChild(list);

  const conv = state.chats.conversations.find((c) => c.id === state.chats.activeId);
  const convBox = el(`<div class="chat-conversation"></div>`);
  if (!conv) {
    convBox.appendChild(el(`<div class="mail-empty">Wähle links einen Chat aus.</div>`));
  } else {
    convBox.appendChild(el(`<div class="chat-conv-head">${conv.type === "group" ? "👥" : "👤"} ${conv.name}</div>`));
    const body = el(`<div class="chat-conv-body"></div>`);
    conv.messages.forEach((m) => {
      body.appendChild(el(`
        <div class="chat-bubble ${m.self ? "self" : "other"}">
          ${conv.type === "group" && !m.self ? `<strong>${m.from}</strong><br/>` : ""}${m.text}
          <span class="meta">${m.time}</span>
        </div>
      `));
    });
    convBox.appendChild(body);

    const foot = el(`
      <div class="chat-conv-foot">
        <input placeholder="Nachricht schreiben …" />
        <button class="btn primary small">Senden</button>
      </div>
    `);
    const input = foot.querySelector("input");
    const sendBtn = foot.querySelector("button");
    const doSend = () => {
      const val = input.value.trim();
      if (!val) return;
      conv.messages.push({ from: state.user.name, text: val, time: "Gerade eben", self: true });
      input.value = "";
      renderPage();
      // Kleine simulierte Antwort bei 1:1-Chats, nur zur Demo-Lebendigkeit.
      if (conv.type === "dm") {
        const convId = conv.id;
        setTimeout(() => {
          if (state.activePage !== "chats") return; // Nutzer ist weg — nichts mehr tun
          const stillThere = state.chats.conversations.find((c) => c.id === convId);
          if (!stillThere) return;
          stillThere.messages.push({ from: stillThere.name, text: "👍", time: "Gerade eben", self: false });
          if (state.chats.activeId === convId) renderPage();
        }, 1200);
      }
    };
    sendBtn.onclick = doSend;
    input.onkeydown = (e) => { if (e.key === "Enter") doSend(); };
    convBox.appendChild(foot);
    setTimeout(() => { body.scrollTop = body.scrollHeight; }, 0);
  }
  layout.appendChild(convBox);
  main.appendChild(layout);
}

const NOTE_TOOLS = [

  { id:"stift", icon:"✏️", label:"Stift" },

function createTextboxEl(tb) {
  const box = el(`
    <div class="hs-textbox" style="left:${tb.x}px; top:${tb.y}px;">
      <div class="hs-textbox-handle">⠿ ⠿ ⠿</div>
      <div class="hs-textbox-content" contenteditable="true" spellcheck="false"></div>
    </div>
  `);
  const content = box.querySelector(".hs-textbox-content");
  content.innerText = tb.text;
  content.addEventListener("blur", () => { tb.text = content.innerText; });
  box.querySelector(".hs-textbox-handle").addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY, origX = tb.x, origY = tb.y;
    function onMove(ev) {
      box.style.left = (origX + ev.clientX - startX) + "px";
      box.style.top = (origY + ev.clientY - startY) + "px";
    }
    function onUp(ev) {
      tb.x = origX + ev.clientX - startX;
      tb.y = origY + ev.clientY - startY;
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  return box;
}

/* ---- Export-Flow (lokal / Nextcloud / KI) ---------------------------- */
function notizenAsMarkdown() {
  return state.notizen.pages
    .map((p, i) => `<!-- Seite ${i + 1} -->\n\n` + p.textboxes.map((t) => t.text).join("\n\n"))
    .join("\n\n---\n\n");
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(`${filename} heruntergeladen.`);
}
function exportPageAsPng() {
  const page = currentNotePage();
  const canvas = document.createElement("canvas");
  canvas.width = 800; canvas.height = 1000;
  const ctx = canvas.getContext("2d");
  if (!ctx) { showToast("Bildexport in dieser Umgebung nicht verfügbar."); return; }
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#eeeeee";
  for (let y = 30; y < canvas.height; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.fillStyle = "#1a1b26"; ctx.font = "16px sans-serif";
  page.textboxes.forEach((tb) => {
    tb.text.split("\n").forEach((line, i) => ctx.fillText(line, tb.x, tb.y + 20 + i * 20));
  });
  canvas.toBlob((blob) => {
    if (!blob) { showToast("Bildexport in dieser Umgebung nicht verfügbar."); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${state.notizen.title}-seite${state.notizen.activePage + 1}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Seite als Bild heruntergeladen.");
  });
}
function flattenFolderOptions(node, path) {
  path = path || node.name;
  let list = [{ id: node.id, path }];
  (node.children || []).forEach((c) => { if (c.type === "folder") list = list.concat(flattenFolderOptions(c, path + " / " + c.name)); });
  return list;
}
function processNoteWithAI(toWiki) {
  const fullText = state.notizen.title + " " + notizenAsMarkdown();
  const subject = guessSubjectFromText(fullText) || "Sonstiges";
  let content = notizenAsMarkdown();
  if (state.aiSettings.notizenMode === "voll") {
    content = `<!-- KI-bearbeitet: zusammengefasst, vervollständigt, Rechtschreibung korrigiert (simuliert) -->\n\n` + content;
  }
  const folderId = docFolderIdForSubject(subject) || "sonstiges";
  addFileToFolder(folderId, `${state.notizen.title}.md`, "note");
  let msg = `Notiz unter „${subject}" in Nextcloud abgelegt`;
  if (toWiki) {
    const collectiveId = guessWikiCollectiveId(subject);
    if (collectiveId) {
      const collective = state.wiki.collectives.find((c) => c.id === collectiveId);
      collective.pages.push({ id:"w" + Date.now(), title: state.notizen.title, md: content, children: [] });
      msg += ` und ins Wiki-Collective „${collective.name}" übernommen.`;
    } else {
      msg += `. Kein passendes Wiki-Collective gefunden — bitte manuell im Wiki anlegen.`;
    }
  } else {
    msg += ".";
  }
  closeModal();
  showToast(msg);
}

/* ============================================================================

function renderWiki(main) {
  main.appendChild(el(`
    <div class="page-header">
      <div class="page-title">Wiki</div>
      <div class="page-sub">Wissensdatenbank — organisiert in Collectives</div>
    </div>
  `));

  if (!state.wiki.activeCollectiveId) {
    const grid = el(`<div class="wiki-collectives-grid"></div>`);
    state.wiki.collectives.forEach((c) => {
      const card = el(`
        <div class="wiki-collective-card">
          <div class="dot" style="background:var(${c.colorVar})"></div>
          <div class="name">${c.name}</div>
          <div class="meta">${countWikiPages(c.pages)} Seiten · ${visibilityLabel(c.visibility)}</div>
        </div>
      `);
      card.onclick = () => { state.wiki.activeCollectiveId = c.id; state.wiki.activePageId = null; renderPage(); };
      grid.appendChild(card);
    });
    const addCard = el(`<div class="wiki-add-card">+ Neues Collective</div>`);
    addCard.onclick = () => {
      const name = prompt("Name des neuen Collectives:");
      if (!name) return;
      const id = "c" + Date.now();
      state.wiki.collectives.push({ id, name, colorVar: COLOR_CYCLE[state.wiki.collectives.length % COLOR_CYCLE.length], visibility:"beide", pages:[] });
      state.wiki.activeCollectiveId = id;
      renderPage();
    };
    grid.appendChild(addCard);
    main.appendChild(grid);
    return;
  }

  const collective = state.wiki.collectives.find((c) => c.id === state.wiki.activeCollectiveId);
  const back = el(`<button class="btn small" style="margin-bottom:14px;">← Alle Collectives</button>`);
  back.onclick = () => { state.wiki.activeCollectiveId = null; renderPage(); };
  main.appendChild(back);

  const layout = el(`<div class="wiki-layout"></div>`);

  // Baum
  const tree = el(`<div class="wiki-tree"></div>`);
  const addRootPage = el(`<button class="btn small" style="width:100%;margin-bottom:8px;">+ Neue Seite</button>`);
  addRootPage.onclick = () => addWikiPage(collective.pages);
  tree.appendChild(addRootPage);
  tree.appendChild(buildWikiTree(collective.pages));
  layout.appendChild(tree);

  // Inhalt
  const content = el(`<div class="wiki-content"></div>`);
  const trail = state.wiki.activePageId ? findWikiPage(collective.pages, state.wiki.activePageId, []) : null;
  const page = trail ? trail[trail.length - 1] : null;

  if (!page) {
    content.innerHTML = `<div style="color:var(--text-dim);font-size:13px;">Wähle links eine Seite aus oder lege eine neue an.</div>`;
  } else {
    const head = el(`<div class="wiki-content-head"></div>`);
    head.appendChild(el(`<h1>${page.title}</h1>`));
    const rightControls = el(`<div style="display:flex;align-items:center;gap:8px;"></div>`);
    rightControls.appendChild(buildVisibilitySelector(collective));
    const addChild = el(`<button class="btn small">+ Unterseite</button>`);
    addChild.onclick = () => addWikiPage(page.children);
    rightControls.appendChild(addChild);
    const toggleBtn = el(`<button class="btn small">${state.wiki.editMode ? "Anzeigen" : "Bearbeiten"}</button>`);
    toggleBtn.onclick = () => { state.wiki.editMode = !state.wiki.editMode; renderPage(); };
    rightControls.appendChild(toggleBtn);
    head.appendChild(rightControls);
    content.appendChild(head);

    if (state.wiki.editMode) {
      const textarea = el(`<textarea class="wiki-md-edit">${page.md}</textarea>`);
      content.appendChild(textarea);
      const saveBtn = el(`<button class="btn primary" style="margin-top:12px;">Speichern</button>`);
      saveBtn.onclick = () => { page.md = textarea.value; state.wiki.editMode = false; renderPage(); showToast("Gespeichert."); };
      content.appendChild(saveBtn);
    } else {
      const rendered = el(`<div class="wiki-md-view"></div>`);
      rendered.innerHTML = (typeof marked !== "undefined") ? marked.parse(page.md) : page.md;
      content.appendChild(rendered);
    }
  }
  layout.appendChild(content);
  main.appendChild(layout);
}

function countWikiPages(pages) {
  return pages.reduce((sum, p) => sum + 1 + countWikiPages(p.children), 0);
}
function visibilityLabel(v) {
  if (v === "schule") return "Nur Schule";
  if (v === "privat") return "Nur Privat";
  if (v === "freunde") return "Ausgewählte Freunde";
  return "Schule & Privat";
}
function buildWikiTree(pages) {
  const wrap = document.createElement("div");
  pages.forEach((p) => {
    const node = document.createElement("div");
    node.className = "wiki-tree-node";
    const row = el(`
      <div class="wiki-tree-row ${state.wiki.activePageId === p.id ? "active" : ""}">
        <span class="wiki-tree-toggle">${p.children.length ? "▾" : "·"}</span><span>${p.title}</span>
      </div>
    `);
    row.onclick = () => { state.wiki.activePageId = p.id; state.wiki.editMode = false; renderPage(); };
    node.appendChild(row);
    if (p.children.length) {
      const childWrap = document.createElement("div");
      childWrap.className = "wiki-tree-children";
      childWrap.appendChild(buildWikiTree(p.children));
      node.appendChild(childWrap);
    }
    wrap.appendChild(node);
  });
  return wrap;
}
function addWikiPage(list) {
  const title = prompt("Titel der neuen Seite:");
  if (!title) return;
  const id = "w" + Date.now();
  list.push({ id, title, md: `# ${title}\n\n`, children: [] });

function buildVisibilitySelector(collective) {

  select.onchange = () => { collective.visibility = select.value; renderPage(); };

  const tabs = el(`<div class="settings-tabs"></div>`);

    const btn = el(`<div class="settings-tab ${state.settingsTab === t.id ? "active" : ""}">${t.label}</div>`);
    btn.onclick = () => { state.settingsTab = t.id; renderPage(); };
    tabs.appendChild(btn);
  });
  layout.appendChild(tabs);

  const panel = el(`<div class="settings-panel"></div>`);
  const builders = {
    profil: buildSettingsProfil, design: buildSettingsDesign, ki: buildSettingsKI,
    faecher: buildSettingsFaecher, gruppe: buildSettingsGruppe, dashboard: buildSettingsDashboard,
    daten: buildSettingsDaten
  };
  panel.appendChild(builders[state.settingsTab]());
  layout.appendChild(panel);

  main.appendChild(layout);
}
PAGE_RENDERERS["einstellungen"] = renderEinstellungen;

function buildSettingsProfil() {
  const box = document.createElement("div");
  box.appendChild(el(`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <div class="avatar" style="width:52px;height:52px;font-size:16px;">${state.user.initials}</div>
      <div>
        <div style="font-weight:600;">${state.user.name}</div>
        <div style="font-size:12px;color:var(--text-dim);">${state.user.school}</div>
      </div>
    </div>
  `));
  box.appendChild(el(`<div class="field-label">Name</div>`));
  const nameInput = el(`<input class="tn-input" value="${state.user.name}" />`);
  nameInput.oninput = () => {
    state.user.name = nameInput.value;
    state.user.initials = nameInput.value.split(" ").map((p) => p[0] || "").join("").slice(0,2).toUpperCase() || "?";
    renderTopbar();
  };
  box.appendChild(nameInput);
  box.appendChild(el(`<div class="field-label">E-Mail</div>`));
  box.appendChild(el(`<input class="tn-input" value="max.mustermann@mol-frw-gym.de" disabled />`));
  box.appendChild(el(`
    <div class="notice-box" style="margin-top:20px;">
      Login läuft über dein Nextcloud-Konto (Single Sign-on) — Passwort und
      Kontodaten werden dort verwaltet, nicht hier.
    </div>
  `));
  return box;
}

function buildSettingsDesign() {
  const box = document.createElement("div");
  box.appendChild(el(`<div class="field-label">Theme</div>`));
  const cards = el(`<div class="theme-cards"></div>`);
  const previewColors = {
    "tokyo-night": ["#1a1b26","#7aa2f7","#bb9af7","#9ece6a"],
    "clean-dark":  ["#18181b","#5b8def","#8c7ae6","#5fae67"],
    "clean-light": ["#f7f7f8","#3568d4","#7952d1","#3c8a48"]
  };
  THEMES.forEach((t) => {
    const c = previewColors[t.id];
    const card = el(`
      <div class="theme-card ${state.theme === t.id ? "active" : ""}">
        <div class="theme-swatch" style="background:${c[0]};">
          <i style="background:${c[1]}"></i><i style="background:${c[2]}"></i><i style="background:${c[3]}"></i>
        </div>
        <div class="tname">${t.label}</div>
      </div>
    `);
    card.onclick = () => { state.theme = t.id; document.documentElement.dataset.theme = t.id; renderPage(); };
    cards.appendChild(card);
  });
  box.appendChild(cards);
  box.appendChild(el(`<div class="notice-box" style="margin-top:20px;">Clean Dark / Clean Light sind bewusst zurückhaltend gehalten — für alle, die kein "Spectacle-Design" wollen.</div>`));

  box.appendChild(el(`<div class="field-label" style="margin-top:26px;">Stundenplan-Darstellung</div>`));
  const ttOptions = [
    { id:"bunt", label:"Bunt", hint:"Volle Fachfarbe" },
    { id:"dezent", label:"Dezent", hint:"Nur farbiger Rand" },
    { id:"neutral", label:"Neutral", hint:"Nur ein kleiner Punkt" }
  ];
  const ttChips = el(`<div style="display:flex;gap:8px;flex-wrap:wrap;"></div>`);
  ttOptions.forEach((o) => {
    const chip = el(`
      <div class="theme-card" style="text-align:center;cursor:pointer;padding:10px 14px;">
        <div class="tname" style="margin-bottom:2px;">${o.label}</div>
        <div style="font-size:10.5px;color:var(--text-dim);">${o.hint}</div>
      </div>
    `);
    if (state.stundenplanStyle === o.id) chip.classList.add("active");
    chip.onclick = () => { state.stundenplanStyle = o.id; renderPage(); };
    ttChips.appendChild(chip);
  });
  box.appendChild(ttChips);
  box.appendChild(el(`<div style="font-size:11px;color:var(--text-dim);margin-top:6px;">Gilt für das WebUntis-Widget und die volle Stundenplan-Seite.</div>`));
  return box;
}

function buildSettingsKI() {
  const box = document.createElement("div");
  const providers = [ { id:"anthropic", label:"Anthropic (Claude)" }, { id:"openai", label:"OpenAI" }, { id:"gemini", label:"Google Gemini" } ];
  providers.forEach((p) => {
    box.appendChild(el(`<div class="field-label">${p.label} — API-Schlüssel</div>`));
    const row = el(`<div style="display:flex;gap:8px;"></div>`);
    const input = el(`<input class="tn-input" type="password" placeholder="sk-..." value="${state.apiKeys[p.id]}" />`);
    input.oninput = () => { state.apiKeys[p.id] = input.value; };
    row.appendChild(input);
    const testBtn = el(`<button class="btn small">Testen</button>`);
    testBtn.onclick = () => showToast("Verbindungstest simuliert — Backend folgt.");
    row.appendChild(testBtn);
    box.appendChild(row);
  });

  box.appendChild(el(`<div class="field-label" style="margin-top:26px;">MCP-Server</div>`));
  const mcpList = el(`<div></div>`);
  function renderMcpList() {
    mcpList.innerHTML = "";
    if (state.mcpServers.length === 0) mcpList.appendChild(el(`<div style="color:var(--text-dim);font-size:12.5px;margin-bottom:8px;">Noch keine MCP-Server hinterlegt.</div>`));
    state.mcpServers.forEach((s, idx) => {
      const row = el(`<div class="mcp-row"><span>${s.name} — ${s.url}</span><button>✕</button></div>`);
      row.querySelector("button").onclick = () => { state.mcpServers.splice(idx, 1); renderMcpList(); };
      mcpList.appendChild(row);
    });
  }
  renderMcpList();
  box.appendChild(mcpList);
  const addRow = el(`
    <div style="display:flex;gap:6px;margin-top:6px;">
      <input class="tn-input" id="mcp-name" placeholder="Name (z. B. Dateisystem)" />
      <input class="tn-input" id="mcp-url" placeholder="URL / Verbindung" />
      <button class="btn small">+</button>
    </div>
  `);
  addRow.querySelector("button").onclick = () => {
    const name = addRow.querySelector("#mcp-name").value.trim();
    const url = addRow.querySelector("#mcp-url").value.trim();
    if (!name) return;
    state.mcpServers.push({ name, url: url || "—" });
    addRow.querySelector("#mcp-name").value = ""; addRow.querySelector("#mcp-url").value = "";
    renderMcpList();
  };
  box.appendChild(addRow);

  box.appendChild(el(`<div class="field-label" style="margin-top:26px;">Notizen-Verarbeitung durch die KI</div>`));
  const modeOptions = [
    { id:"voll", label:"Volle Bearbeitung", hint:"Zusammenfassen, vervollständigen, Rechtschreibung korrigieren" },
    { id:"einsortieren", label:"Nur einsortieren", hint:"Inhalt bleibt unverändert, nur Ordner/Wiki wird gewählt" }
  ];
  modeOptions.forEach((o) => {
    const row = el(`
      <label style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;cursor:pointer;">
        <input type="radio" name="notizen-mode" ${state.aiSettings.notizenMode === o.id ? "checked" : ""} style="margin-top:3px;" />
        <span><strong style="font-size:13px;">${o.label}</strong><br/><span style="font-size:11.5px;color:var(--text-dim);">${o.hint}</span></span>
      </label>
    `);
    row.querySelector("input").onchange = () => { state.aiSettings.notizenMode = o.id; };
    box.appendChild(row);
  });
  return box;
}

function buildSettingsFaecher() {
  const box = document.createElement("div");
  box.appendChild(el(`<div class="field-label">Farbe pro Fach</div>`));
  state.subjectsList.forEach((subject) => {
    getSubjectColor(subject); // sicherstellen, dass eine Farbe existiert
    const row = el(`<div class="subject-row"><span class="sname">${subject}</span></div>`);
    COLOR_CYCLE.forEach((cv) => {
      const selected = state.subjectColors[subject] === cv;
      const swatch = el(`<button class="swatch-btn ${selected ? "selected" : ""}" style="background:var(${cv})"></button>`);
      swatch.onclick = () => { state.subjectColors[subject] = cv; renderPage(); };
      row.appendChild(swatch);
    });
    box.appendChild(row);
  });
  const addRow = el(`
    <div style="display:flex;gap:8px;margin-top:16px;">
      <input class="tn-input" id="new-subject" placeholder="Neues Fach" />
      <button class="btn small">Hinzufügen</button>
    </div>
  `);
  addRow.querySelector("button").onclick = () => {
    const val = addRow.querySelector("#new-subject").value.trim();
    if (!val || state.subjectsList.includes(val)) return;
    state.subjectsList.push(val);
    getSubjectColor(val);
    addRow.querySelector("#new-subject").value = "";
    renderPage();
  };
  box.appendChild(addRow);
  return box;
}

function buildSettingsGruppe() {
  const box = document.createElement("div");
  box.appendChild(el(`
    <p style="font-size:13px;color:var(--text-muted);line-height:1.6;max-width:480px;">
      Steuert, welche Module in der linken Navigation sichtbar sind. Schul-Module
      (Mail, Stundenplan, schul.cloud) werden im "Privat"-Modus ausgeblendet.
    </p>
  `));
  const row = el(`<div style="display:flex;gap:8px;margin-top:10px;"></div>`);
  const schuleBtn = el(`<button class="btn ${state.group === "schule" ? "primary" : ""}">🎓 Schule</button>`);
  const privatBtn = el(`<button class="btn ${state.group === "privat" ? "primary" : ""}">🏠 Privat</button>`);
  schuleBtn.onclick = () => setGroup("schule");
  privatBtn.onclick = () => setGroup("privat");
  row.appendChild(schuleBtn); row.appendChild(privatBtn);
  box.appendChild(row);
  return box;
}

function buildSettingsDashboard() {
  const box = document.createElement("div");
  box.appendChild(el(`<p style="font-size:13px;color:var(--text-muted);">Widget-Anordnung auf der Übersicht zurücksetzen, falls etwas unübersichtlich geworden ist.</p>`));
  const resetBtn = el(`<button class="btn" style="margin-top:8px;">Widget-Layout zurücksetzen</button>`);
  resetBtn.onclick = () => {
    state.widgets = [
      { id:"nachrichten", title:"Nachrichten", slot:"slotA", hidden:false },
      { id:"schnellzugriff", title:"Schnellzugriff", slot:"slotB", hidden:false },
      { id:"kalender", title:"Kalender", slot:"slotC", hidden:false },
      { id:"webuntis", title:"WebUntis", slot:"slotD", hidden:false }
    ];
    showToast("Widget-Layout zurückgesetzt.");
  };
  box.appendChild(resetBtn);
  return box;
}

function buildSettingsDaten() {
  const box = document.createElement("div");
  box.appendChild(el(`
    <div class="notice-box" style="margin-bottom:18px;">
      Solange es noch kein Backend gibt, lebt alles nur im Arbeitsspeicher —
      ein Neuladen der Seite setzt das Dashboard zurück. Mit Export/Import
      kannst du deinen Stand trotzdem sichern und wiederherstellen.
    </div>
  `));

  box.appendChild(el(`<div class="field-label">Sichern</div>`));
  const exportBtn = el(`<button class="btn">Als Datei herunterladen</button>`);
  exportBtn.onclick = () => {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "school-aio-backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Backup heruntergeladen.");
  };
  box.appendChild(exportBtn);

  box.appendChild(el(`<div class="field-label" style="margin-top:20px;">Wiederherstellen</div>`));
  const importInput = el(`<input type="file" accept="application/json" class="tn-input" />`);
  importInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const loaded = JSON.parse(reader.result);
        Object.keys(loaded).forEach((key) => { state[key] = loaded[key]; });
        document.documentElement.dataset.theme = state.theme;
        renderAll();
        showToast("Daten wiederhergestellt.");
      } catch (err) { showToast("Datei konnte nicht gelesen werden — ist es ein gültiges Backup?"); }
    };
    reader.readAsText(file);
  };
  box.appendChild(importInput);
  return box;
}

/* ============================================================================
   INIT
   ============================================================================ */
function renderAll() {
  document.documentElement.dataset.theme = state.theme;
  renderTopbar();
  document.getElementById("landing").classList.toggle("hidden", state.loggedIn);
  document.getElementById("dashboard").classList.toggle("visible", state.loggedIn);
  if (state.loggedIn) { renderIconrail(); renderPage(); }
}
renderAll();
typeMotto();
</script>
